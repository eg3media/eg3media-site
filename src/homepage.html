<style>
  @import url('https://fonts.googleapis.com/css2?family=Anton&display=swap');

  /* Hide the site header on the homepage only */
  #header,
  header.header {
    display: none !important;
  }

  /* Remove the leftover space at the top of the homepage */
  #page,
  #sections,
  .page-section:has(.eg3-scroll),
  .page-section:has(.eg3-scroll) .content-wrapper,
  .page-section:has(.eg3-scroll) .content,
  .page-section:has(.eg3-scroll) .sqs-block,
  .page-section:has(.eg3-scroll) .sqs-block-content {
    padding-top: 0 !important;
    margin-top: 0 !important;
  }
  .page-section:has(.eg3-scroll) .section-border,
  .page-section:has(.eg3-scroll) .section-background {
    top: 0 !important;
  }

  .eg3-scroll {
    --count: 8;
    --step: 70vh;       /* scroll distance per word: lower = faster */
    --tracking: 0.08em; /* space between letters: try 0.05em to 0.15em */
    position: relative;
    width: 100vw;
    margin-left: calc(50% - 50vw);
    height: calc(var(--count) * var(--step) + 100vh);
    background: #000;
  }

  .eg3-stage {
    position: sticky;
    top: 0;
    left: 0;
    width: 100%;
    height: 100vh;
    overflow: hidden;
    display: flex;
    align-items: center;
    justify-content: center;
    background: #000;
    isolation: isolate;
  }

  /* Backup pinning if Squarespace blocks sticky */
  .eg3-scroll.use-fixed .eg3-stage {
    position: absolute;
    top: 0;
  }
  .eg3-scroll.use-fixed .eg3-stage.is-pinned {
    position: fixed;
    top: 0;
    width: 100vw;
  }
  .eg3-scroll.use-fixed .eg3-stage.is-after {
    top: auto;
    bottom: 0;
  }

  .eg3-bg {
    position: absolute;
    inset: 0;
    background-size: cover;
    background-position: center;
    opacity: 0;
    will-change: opacity, transform;
    pointer-events: none;
  }

  /* Tint over the photos: raise the last number to darken, set to 0 to remove */
  .eg3-shade {
    position: absolute;
    inset: 0;
    background: rgba(0,0,0,0.15);
    opacity: 0;
    pointer-events: none;
  }

  /* No z-index here on purpose, so the words can blend with the photos */
  .eg3-nav {
    position: relative;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 0;
    padding: 0 16px;
    text-align: center;
  }

  .eg3-scroll .eg3-link {
    display: inline-block;
    width: fit-content;
    font-family: 'Anton', 'Impact', sans-serif !important;
    font-size: clamp(2rem, min(11vw, 11vh), 7rem);
    font-weight: 400 !important;
    line-height: 1;
    letter-spacing: var(--tracking);
    padding-left: var(--tracking);   /* balances the extra space after the last letter */
    text-transform: uppercase;
    white-space: nowrap;
    color: #fff;
    text-decoration: none !important;
    background-image: none !important;
    transform-origin: center center;
    opacity: 0;                      /* hidden until the intro brings them in */
    will-change: transform, opacity;
  }
  .eg3-scroll .eg3-link.is-blend {
    mix-blend-mode: difference;
  }

  /* ---------- Opening sequence ---------- */
  .eg3-intro {
    position: absolute;
    inset: 0;
    z-index: 5;
    display: flex;
    align-items: center;
    justify-content: center;
    pointer-events: none;
  }

  /* Stop Squarespace's own animations from slowing down the intro */
  .eg3-intro,
  .eg3-intro * {
    transition: none !important;
    animation: none !important;
  }

  .eg3-logo {
    position: absolute;
    width: min(56vw, 640px);
    opacity: 0;
    will-change: transform, opacity, filter;
  }
  .eg3-logo svg {
    display: block;
    width: 100%;
    height: auto;
    overflow: visible;
  }
  .eg3-logo path,
  .eg3-logo polygon {
    fill: #fff;
    fill-opacity: 0;
    stroke: #fff;
    stroke-linejoin: round;   /* smooth corners where lines meet */
    stroke-linecap: round;    /* smooth ends on the tracing line */
  }

  .eg3-welcome {
    position: absolute;
    margin: 0;
    font-family: 'Anton', 'Impact', sans-serif !important;
    font-weight: 400 !important;
    font-size: clamp(3rem, 13vw, 12rem);
    line-height: 1;
    letter-spacing: 0.12em;
    padding-left: 0.12em;
    text-transform: uppercase;
    white-space: nowrap;
    color: #fff !important;
    will-change: opacity, letter-spacing;
  }
  .eg3-welcome span {
    display: inline-block;
    opacity: 0;
    will-change: transform, opacity, filter;
  }
</style>

      var lout = easeInOut(span(LOGO_OUT_AT, LOGO_OUT));
      var shown = elapsed() >= TRACE_AT ? 1 : 0;
      var glowA = (0.9 - 0.55 * fill) * (1 - lout);

      var grow = span(TRACE_AT, LOGO_OUT_AT + LOGO_OUT - TRACE_AT);
      var size = LOGO_START_SIZE + (LOGO_END_SIZE - LOGO_START_SIZE) * grow;

      logo.style.opacity = shown * (1 - lout);
      logo.style.transform = 'scale(' + size.toFixed(4) + ')';
      logo.style.filter =
        'drop-shadow(0 0 ' + GLOW + 'px rgba(255,255,255,' + glowA.toFixed(3) + ')) ' +
        'blur(' + (lout * 10).toFixed(2) + 'px)';
      logo.style.visibility = lout >= 1 ? 'hidden' : 'visible';

      // 2. Welcome: letters rise in out of a blur, then ease into wider spacing as they fade
      letterEls.forEach(function (el, i) {
        var a = easeOut(span(WELCOME_AT + LETTER_STAGGER * i, LETTER_DUR));
        el.style.opacity = a;
        el.style.transform = 'translateY(' + ((1 - a) * 40) + '%)';
        el.style.filter = 'blur(' + ((1 - a) * 8).toFixed(2) + 'px)';
      });
      var wOut = span(WELCOME_OUT_AT, WELCOME_OUT);
      var wSpread = easeInOutSine(wOut);
      welcome.style.opacity = (1 - easeIn(wOut)).toFixed(3);
      var ls = (0.12 + 0.3 * wSpread).toFixed(4) + 'em';
      welcome.style.letterSpacing = ls;
      welcome.style.paddingLeft = ls;
      welcome.style.filter = 'blur(' + (wOut * 6).toFixed(2) + 'px)';
      welcome.style.visibility = wOut >= 1 ? 'hidden' : 'visible';
    }

    function scrollPos() {
      return window.pageYOffset || document.documentElement.scrollTop || document.body.scrollTop || 0;
    }

    function setTracking(link, w) {
      var t = 'calc(var(--tracking) + ' + (EXTRA_TRACKING * w).toFixed(4) + 'em)';
      link.style.letterSpacing = t;
      link.style.paddingLeft = t;
    }

    function measure() {
      var vh = window.innerHeight;
      links.forEach(function (link) { setTracking(link, 0); });
      var avail = Math.max(0, vh * 0.92 - nav.offsetHeight);

      links.forEach(function (link, j) {
        hs[j] = link.offsetHeight;
        var fs = parseFloat(getComputedStyle(link).fontSize) || 0;
        var chars = link.textContent.length + 1;
        var widthAtFull = link.offsetWidth + chars * EXTRA_TRACKING * fs;
        var fitW = (stage.clientWidth * 0.95) / widthAtFull;
        var fitH = 1 + avail / hs[j];
        smax[j] = Math.max(1, Math.min(MAX_SCALE, fitW, fitH));
      });
      cur = null;
    }

    function pin() {
      var rect = wrap.getBoundingClientRect();
      var vh = window.innerHeight;

      if (!useFixed && rect.top < -5 && rect.bottom > vh + 5) {
        if (Math.abs(stage.getBoundingClientRect().top) > 2) {
          useFixed = true;
          wrap.classList.add('use-fixed');
        }
      }
      if (useFixed) {
        stage.classList.toggle('is-pinned', rect.top <= 0 && rect.bottom >= vh);
        stage.classList.toggle('is-after', rect.bottom < vh);
      }
    }

    function target() {
      var rect = wrap.getBoundingClientRect();
      var vh = window.innerHeight;
      var y = scrollPos();

      var top = rect.top + y;
      var begin = Math.max(0, top - vh);
      var end = top + rect.height - vh;
      if (end <= begin) end = begin + 1;

      var progress = Math.min(1, Math.max(0, (y - begin) / (end - begin)));
      var raw = Math.min(N - 1, progress * (N + 0.3) - 1);

      var base = Math.floor(raw);
      var f = raw - base;
      var eased;

      if (base === -1) {
        eased = easeOut(clamp01(f / (1 - HOLD / 2)));
      } else {
        var g = clamp01((f - HOLD / 2) / (1 - HOLD));
        eased = g * g * g * (g * (g * 6 - 15) + 10);
      }
      return Math.min(N - 1, base + eased);
    }

    function render(p) {
      renderIntro();

      var es = [], ws = [], total = 0;
      links.forEach(function (link, j) {
        var w = Math.max(0, 1 - Math.abs(p - j));
        ws[j] = w;
        es[j] = hs[j] * (smax[j] - 1) * w;
        total += es[j];
      });

      var started = Math.min(1, Math.max(0, p + 1));
      var restOpacity = 1 - (1 - DIM) * started;
      var bIn = introDone ? 1 : easeInOut(span(BASE_AT, BASE_DUR));
      var vw = window.innerWidth;

      shade.style.opacity = bIn;

      if (baseLayer) {
        baseLayer.style.opacity = (1 - started) * bIn;
        var zoom = (1 + 0.06 * started) * (1 + INTRO_ZOOM * (1 - bIn));
        baseLayer.style.transform = 'scale(' + zoom + ')';
      }

      var acc = 0;
      links.forEach(function (link, j) {
        var w = ws[j];
        var s = 1 + (smax[j] - 1) * w;
        var ty = acc + es[j] / 2 - total / 2;
        acc += es[j];

        var a = introWord(j);
        var side = j % 2 === 0 ? -1 : 1;
        var ox = side * vw * FLY_DISTANCE * (1 - a);

        link.style.transform = 'translateX(' + ox + 'px) translateY(' + ty + 'px) scale(' + s + ')';
        link.style.opacity = Math.max(w, restOpacity) * a;
        link.style.pointerEvents = a > 0.5 ? 'auto' : 'none';
        setTracking(link, w);
        link.classList.toggle('is-blend', w >= BLEND_AT);

        var layer = layers[j];
        if (layer) {
          layer.style.opacity = w * bIn;
          layer.style.transform = 'scale(' + (1.06 - 0.06 * w) + ')';

          var showing = w * bIn > 0.02;
          if (RESTART_GIFS && showing && !wasShowing[j]) restartGif(j);
          wasShowing[j] = showing;
        }
      });
    }

    function tick() {
      var t = target();
      if (cur === null) cur = t;
      cur += (t - cur) * SMOOTH;
      if (Math.abs(t - cur) < 0.0005) cur = t;
      render(cur);
      if (cur !== t) {
        requestAnimationFrame(tick);
      } else {
        running = false;
      }
    }

    function kick() {
      if (running) return;
      running = true;
      requestAnimationFrame(tick);
    }

    /* ---------- Run the opening sequence ---------- */
    var seenBefore = false;
    if (FULL_INTRO_ONCE) {
      try { seenBefore = sessionStorage.getItem('eg3IntroSeenV2') === '1'; } catch (e) {}
      try { sessionStorage.setItem('eg3IntroSeenV2', '1'); } catch (e) {}
    }
    // repeat visits and skips land right after Welcome is gone
    var startOffset = seenBefore ? WELCOME_GONE : 0;

    function skipAhead() {
      if (introDone || introStart === null) return;
      if (elapsed() < WELCOME_GONE) introStart = performance.now() - WELCOME_GONE;
    }
    ['wheel', 'touchstart', 'keydown', 'mousedown'].forEach(function (evt) {
      window.addEventListener(evt, skipAhead, { passive: true });
    });

    function introLoop() {
      if (cur === null) cur = target();
      if (!introDone && introStart !== null && elapsed() >= INTRO_TOTAL) introDone = true;
      render(cur);
      if (!introDone) requestAnimationFrame(introLoop);
    }

    function startIntro() {
      if (introStart !== null || introDone) return;
      introStart = performance.now() - startOffset;
    }

    if (!introDone) {
      if (seenBefore && real(baseUrl)) {
        var img = new Image();
        img.onload = startIntro;
        img.onerror = startIntro;
        img.src = baseUrl;
        if (img.complete) startIntro();
        setTimeout(startIntro, 2000);
      } else if (document.fonts && document.fonts.ready) {
        document.fonts.ready.then(startIntro);
        setTimeout(startIntro, 1500);
      } else {
        startIntro();
      }
      requestAnimationFrame(introLoop);
    } else {
      intro.style.display = 'none';
    }

    window.addEventListener('scroll', function () { pin(); kick(); }, { passive: true });
    window.addEventListener('resize', function () { measure(); pin(); kick(); });
    window.addEventListener('load', function () { measure(); pin(); kick(); loadGifCopies(); });
    if (document.fonts && document.fonts.ready) {
      document.fonts.ready.then(function () { measure(); kick(); });
    }

    measure();
    pin();
    kick();
  })();
</script>
