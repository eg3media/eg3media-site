<style>

  /* Hide the site header on the homepage only */
  #header,
  header.header {
    display: none !important;
  }

  /* Remove the leftover space at the top of the homepage */
  #page,
  #sections,
  .page-section:has(.eg3-scroll),
  .page-section:has(.eg3-scroll) .content-wrapper,
  .page-section:has(.eg3-scroll) .content,
  .page-section:has(.eg3-scroll) .sqs-block,
  .page-section:has(.eg3-scroll) .sqs-block-content {
    padding-top: 0 !important;
    margin-top: 0 !important;
  }
  .page-section:has(.eg3-scroll) .section-border,
  .page-section:has(.eg3-scroll) .section-background {
    top: 0 !important;
  }

  .eg3-scroll {
    --count: 8;
    --step: 70vh;       /* scroll distance per word: lower = faster */
    --tracking: 0.08em; /* space between letters: try 0.05em to 0.15em */
    position: relative;
    width: 100vw;
    margin-left: calc(50% - 50vw);
    height: calc(var(--count) * var(--step) + 100vh);
    background: #000;
  }

  .eg3-stage {
    position: sticky;
    top: 0;
    left: 0;
    width: 100%;
    height: 100vh;
    overflow: hidden;
    display: flex;
    align-items: center;
    justify-content: center;
    background: #000;
    isolation: isolate;
  }

  /* Backup pinning if Squarespace blocks sticky */
  .eg3-scroll.use-fixed .eg3-stage {
    position: absolute;
    top: 0;
  }
  .eg3-scroll.use-fixed .eg3-stage.is-pinned {
    position: fixed;
    top: 0;
    width: 100vw;
  }
  .eg3-scroll.use-fixed .eg3-stage.is-after {
    top: auto;
    bottom: 0;
  }

  .eg3-bg {
    position: absolute;
    inset: 0;
    background-size: cover;
    background-position: center;
    opacity: 0;
    will-change: opacity, transform;
    pointer-events: none;
  }

  /* Tint over the photos: raise the last number to darken, set to 0 to remove */
  .eg3-shade {
    position: absolute;
    inset: 0;
    background: rgba(0,0,0,0.15);
    opacity: 0;
    pointer-events: none;
  }

  /* No z-index here on purpose, so the words can blend with the photos */
  .eg3-nav {
    position: relative;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 0;
    padding: 0 16px;
    text-align: center;
  }

  .eg3-scroll .eg3-link {
    display: inline-block;
    width: fit-content;
    font-family: 'Anton', 'Impact', sans-serif !important;
    font-size: clamp(2rem, min(11vw, 11vh), 7rem);
    font-weight: 400 !important;
    line-height: 1;
    letter-spacing: var(--tracking);
    padding-left: var(--tracking);   /* balances the extra space after the last letter */
    text-transform: uppercase;
    white-space: nowrap;
    color: #fff;
    text-decoration: none !important;
    background-image: none !important;
    transform-origin: center center;
    opacity: 0;                      /* hidden until the intro brings them in */
    will-change: transform, opacity;
  }
  .eg3-scroll .eg3-link.is-blend {
    mix-blend-mode: difference;
  }

  /* ---------- Opening sequence ---------- */
  .eg3-intro {
    position: absolute;
    inset: 0;
    z-index: 5;
    display: flex;
    align-items: center;
    justify-content: center;
    pointer-events: none;
  }

  /* Stop Squarespace's own animations from slowing down the intro */
  .eg3-intro,
  .eg3-intro * {
    transition: none !important;
    animation: none !important;
  }

  .eg3-logo {
    position: absolute;
    width: min(56vw, 640px);
    opacity: 0;
    will-change: transform, opacity, filter;
  }
  .eg3-logo svg {
    display: block;
    width: 100%;
    height: auto;
    overflow: visible;
  }
  .eg3-logo path,
  .eg3-logo polygon {
    fill: #fff;
    fill-opacity: 0;
    stroke: #fff;
    stroke-linejoin: round;   /* smooth corners where lines meet */
    stroke-linecap: round;    /* smooth ends on the tracing line */
  }

  .eg3-welcome {
    position: absolute;
    margin: 0;
    font-family: 'Anton', 'Impact', sans-serif !important;
    font-weight: 400 !important;
    font-size: clamp(3rem, 13vw, 12rem);
    line-height: 1;
    letter-spacing: 0.12em;
    padding-left: 0.12em;
    text-transform: uppercase;
    white-space: nowrap;
    color: #fff !important;
    will-change: opacity, letter-spacing;
  }
  .eg3-welcome span {
    display: inline-block;
    opacity: 0;
    will-change: transform, opacity, filter;
  }

  /* ---------- hero shown first: a full-screen header video with the headline over it. Scrolling moves it out and the word menu floats in ---------- */
  .eg3-hero { position: absolute; inset: 0; z-index: 4; font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif; color: #f4f4f2; }
  .eg3-hero-bg { position: absolute; inset: 0; z-index: 3; pointer-events: none; background: #000; }
  .eg3-hero > * { position: absolute; will-change: transform, opacity; }
  .eg3-hero a { color: inherit; text-decoration: none; }
  .h-film { inset: 0; overflow: hidden; }
  .h-film .h-fill, .h-film video { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; background: #000 center / cover no-repeat; }
  .h-film::after { content: ''; position: absolute; inset: 0; background: linear-gradient(180deg, rgba(0,0,0,.55) 0%, rgba(0,0,0,0) 22%, rgba(0,0,0,0) 45%, rgba(0,0,0,.78) 100%), linear-gradient(90deg, rgba(0,0,0,.45) 0%, rgba(0,0,0,0) 60%); }
  .h-nav { left: clamp(20px, 4vw, 56px); right: clamp(20px, 4vw, 56px); top: 22px; display: flex; justify-content: space-between; align-items: center; }
  .h-logo { display: block; width: 74px; }
  .h-logo svg { display: block; width: 100%; height: auto; }
  .h-nav nav { display: flex; gap: clamp(16px, 2.6vw, 34px); }
  .h-nav nav a { font-family: 'Anton', 'Impact', sans-serif; font-size: 15px; letter-spacing: .1em; text-transform: uppercase; opacity: .82; transition: opacity .2s; }
  .h-nav nav a:hover { opacity: 1; }
  .h-copy { left: clamp(20px, 4vw, 56px); right: clamp(20px, 4vw, 56px); bottom: clamp(36px, 9vh, 96px); max-width: 980px; }
  .h-copy h1 { margin: 0 0 18px; font-family: 'Anton', 'Impact', sans-serif; font-weight: 400; text-transform: uppercase; font-size: clamp(2.8rem, 7.2vw, 7.6rem); line-height: .92; letter-spacing: .02em; }
  .h-copy h1 span { display: block; }
  .h-copy p { margin: 0 0 26px; max-width: 46ch; font-size: clamp(15px, 1.3vw, 18px); line-height: 1.5; color: #d9d9d4; }
  .h-acts { display: flex; flex-wrap: wrap; gap: 12px; }
  .h-btn { display: inline-flex; align-items: center; justify-content: center; min-height: 48px; padding: 0 26px; border: 1px solid rgba(255,255,255,.6); border-radius: 999px; font-family: 'Anton', 'Impact', sans-serif; font-size: 15px; letter-spacing: .12em; text-transform: uppercase; transition: background-color .2s, color .2s, border-color .2s, transform .15s; }
  .h-btn:hover { border-color: #fff; background: rgba(255,255,255,.08); }
  .h-btn:active { transform: scale(.97); }
  .h-btn--solid { background: #f4f4f2; color: #000 !important; border-color: #f4f4f2; }
  .h-btn--solid:hover { background: #fff; }
  .eg3-scrollhint { position: absolute; left: 50%; bottom: 16px; z-index: 5; transform: translateX(-50%); font-size: 10px; letter-spacing: .32em; text-transform: uppercase; color: #9a9a96; pointer-events: none; }
  @media (max-width: 760px) {
    .h-nav nav a:not(:last-child) { display: none; }
    .h-copy h1 { font-size: 15vw; }
    .h-acts .h-btn { flex: 1 1 100%; }
    .eg3-scrollhint { display: none; }
  }
</style>

<script>
  (function () {
    var wrap = document.querySelector('.eg3-scroll');
    if (!wrap) return;
    var stage = wrap.querySelector('.eg3-stage');
    var nav = wrap.querySelector('.eg3-nav');
    var shade = wrap.querySelector('.eg3-shade');
    var intro = wrap.querySelector('.eg3-intro');
    var logo = wrap.querySelector('.eg3-logo');
    var shapes = Array.prototype.slice.call(logo.querySelectorAll('path, polygon'));
    var welcome = wrap.querySelector('.eg3-welcome');
    var links = Array.prototype.slice.call(wrap.querySelectorAll('.eg3-link'));
    var N = links.length;

    var MAX_SCALE = 3.2;               // how big the active word gets
    var DIM = 0.6;                     // how faded the other words get (0 = invisible, 1 = no fade)
    var SMOOTH = 0.16;                 // lower = floatier, higher = snappier (0.05 to 0.25)
    var BLEND_AT = 0.5;                // how grown a word is when Difference kicks in (0 to 1)
    var EXTRA_TRACKING = 0.06;         // extra letter spacing (em) added at full size
    var HOLD = 0.5;                    // share of each word's scroll spent holding at full size (0 to 0.7)
    var RESTART_GIFS = true;           // restart each GIF when its word takes over

    // Opening sequence timing (milliseconds)
    var TRACE_AT = 200;                // 1. outline starts drawing on black
    var TRACE_STAGGER = 70;            //    delay between each logo piece starting its trace
    var TRACE_DUR = 1000;              //    how long each piece takes to trace
    var FILL_AT = 1500;                //    solid logo fills in
    var FILL_DUR = 700;
    var GLOW = 10;                     //    glow size around the tracing line (px)
    var LOGO_OUT_AT = 2800;            //    logo fades out
    var LOGO_OUT = 700;
    var LOGO_START_SIZE = 0.92;        //    logo size when it appears
    var LOGO_END_SIZE = 1.12;          //    logo size by the time it's gone (grows steadily in between)
    var WELCOME_AT = 3500;             // 2. Welcome writes in (after the logo is gone)
    var LETTER_STAGGER = 80;
    var LETTER_DUR = 600;
    var WELCOME_OUT_AT = 4300;         //    Welcome eases wider and fades
    var WELCOME_OUT = 700;
    var WELCOME_GONE = WELCOME_OUT_AT + WELCOME_OUT;
    var BASE_AT = WELCOME_OUT_AT;      // 3. base picture fades in while Welcome fades out
    var BASE_DUR = 1600;
    var WORDS_AT = WELCOME_GONE + 500; // 4. list words fly in, only after Welcome is fully gone
    var WORD_STAGGER = 130;
    var WORD_DUR = 1000;
    var INTRO_ZOOM = 0.25;             // how zoomed in the base picture starts
    var FLY_DISTANCE = 0.6;            // how far off-screen words start (share of screen width)
    var FULL_INTRO_ONCE = true;        // full intro plays the first visit only; after that it starts right after Welcome

    var layers = [];
    var urls = [];
    var blobs = [];
    var blobUrls = [];
    var wasShowing = [];
    var lengths = [];
    var baseLayer = null;
    var hs = [], smax = [];
    var cur = null, running = false;
    var useFixed = false;

    var reduceMotion = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
    var introStart = null;
    var introDone = reduceMotion;
    var INTRO_TOTAL = WORDS_AT + WORD_STAGGER * (N - 1) + WORD_DUR;

    function real(url) { return url && url.indexOf('PASTE-') !== 0; }
    function clamp01(x) { return Math.min(1, Math.max(0, x)); }
    function easeOut(t) { return 1 - Math.pow(1 - t, 4); }
    function easeIn(t) { return t * t; }
    function easeInOut(t) { return t < 0.5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2; }
    function easeInOutSine(t) { return -(Math.cos(Math.PI * t) - 1) / 2; }

    // read /site-media first (instant from the last visit), so pictures come from there
    var media = null, layersReady = false;
    EG3.media(function (map) { media = map; if (layersReady) applyMedia(); });
    function slotOf(link) {
      return link.getAttribute('data-slot') ||
        (link.getAttribute('href') || '').split('?')[0].split('/').filter(Boolean).pop() || '';
    }

    function makeLayer(url) {
      var layer = document.createElement('div');
      layer.className = 'eg3-bg';
      layer.style.backgroundImage = 'url("' + url + '")';
      new Image().src = url;
      return layer;
    }

    links.forEach(function (link) {
      var url = (media && media['home.' + slotOf(link)]) || link.getAttribute('data-bg');
      var layer = null;
      if (real(url)) {
        layer = makeLayer(url);
        stage.insertBefore(layer, stage.firstChild);
      }
      layers.push(layer);
      urls.push(real(url) ? url : null);
      blobs.push(null);
      blobUrls.push(null);
      wasShowing.push(false);
      link.style.setProperty('color', '#fff', 'important');
    });

    // Base background shown before scrolling
    var baseUrl = (media && media.base) || wrap.getAttribute('data-base-bg');
    if (real(baseUrl)) {
      baseLayer = makeLayer(baseUrl);
      baseLayer.style.opacity = 0;
      stage.insertBefore(baseLayer, stage.firstChild);
    }

    // swap in newer pictures from /site-media once the page has read it
    var copiesWanted = false;
    function setLayer(j, url) {
      if (!url || urls[j] === url) return;
      if (layers[j]) {
        layers[j].style.backgroundImage = 'url("' + url + '")';
        new Image().src = url;
      } else {
        layers[j] = makeLayer(url);
        stage.insertBefore(layers[j], baseLayer ? baseLayer.nextSibling : stage.firstChild);
      }
      urls[j] = url;
      blobs[j] = null;
      if (blobUrls[j]) { URL.revokeObjectURL(blobUrls[j]); blobUrls[j] = null; }
      if (copiesWanted) loadGifCopy(j);
    }
    function applyMedia() {
      if (!media) return;
      links.forEach(function (link, j) { setLayer(j, media['home.' + slotOf(link)]); });
      if (media.base && media.base !== baseUrl) {
        baseUrl = media.base;
        if (baseLayer) {
          baseLayer.style.backgroundImage = 'url("' + baseUrl + '")';
          new Image().src = baseUrl;
        } else {
          baseLayer = makeLayer(baseUrl);
          baseLayer.style.opacity = 0;
          stage.insertBefore(baseLayer, stage.firstChild);
        }
      }
      kick();
    }
    layersReady = true;

    // Measure each logo outline so it can be traced
    shapes.forEach(function (el, i) {
      var len = 2000;
      try { len = el.getTotalLength() || len; } catch (e) {}
      len = Math.ceil(len) + 2;
      lengths[i] = len;
      el.style.strokeDasharray = len + ' ' + len;
      el.style.strokeDashoffset = len;
    });

    // Split Welcome into letters
    var letters = welcome.textContent.trim().split('');
    welcome.innerHTML = '';
    var letterEls = letters.map(function (ch) {
      var s = document.createElement('span');
      s.textContent = ch;
      welcome.appendChild(s);
      return s;
    });

    /* ---------- GIF restarts ---------- */
    function loadGifCopy(j) {
      var url = urls[j];
      if (!url || !/\.gif(\?|$)/i.test(url)) return;
      fetch(url, { mode: 'cors' })
        .then(function (r) { if (!r.ok) throw 0; return r.blob(); })
        .then(function (b) { if (urls[j] === url) blobs[j] = b; })
        .catch(function () {});
    }
    function loadGifCopies() {
      if (!RESTART_GIFS || !window.fetch || !window.URL) return;
      copiesWanted = true;
      urls.forEach(function (url, j) { loadGifCopy(j); });
    }

    function restartGif(j) {
      var layer = layers[j];
      if (!layer || !blobs[j]) return;
      var old = blobUrls[j];
      blobUrls[j] = URL.createObjectURL(blobs[j]);
      layer.style.backgroundImage = 'url("' + blobUrls[j] + '")';
      if (old) setTimeout(function () { URL.revokeObjectURL(old); }, 1000);
    }

    /* ---------- Opening sequence clock ---------- */
    function elapsed() {
      if (introDone) return INTRO_TOTAL;
      if (introStart === null) return 0;
      return performance.now() - introStart;
    }
    function span(start, dur) { return clamp01((elapsed() - start) / dur); }

    function introWord(j) {
      if (introDone) return 1;
      return easeOut(span(WORDS_AT + WORD_STAGGER * j, WORD_DUR));
    }

    function renderIntro() {
      if (introDone) {
        intro.style.display = 'none';
        return;
      }

      // 1. Logo: glowing outline traces each piece, then the solid logo fills in
      shapes.forEach(function (el, i) {
        var t = easeInOut(span(TRACE_AT + TRACE_STAGGER * i, TRACE_DUR));
        el.style.strokeDashoffset = (lengths[i] * (1 - t)).toFixed(2);
      });
      var fill = easeInOut(span(FILL_AT, FILL_DUR));
      shapes.forEach(function (el) { el.style.fillOpacity = fill.toFixed(3); });

      var lout = easeInOut(span(LOGO_OUT_AT, LOGO_OUT));
      var shown = elapsed() >= TRACE_AT ? 1 : 0;
      var glowA = (0.9 - 0.55 * fill) * (1 - lout);

      var grow = span(TRACE_AT, LOGO_OUT_AT + LOGO_OUT - TRACE_AT);
      var size = LOGO_START_SIZE + (LOGO_END_SIZE - LOGO_START_SIZE) * grow;

      logo.style.opacity = shown * (1 - lout);
      logo.style.transform = 'scale(' + size.toFixed(4) + ')';
      logo.style.filter =
        'drop-shadow(0 0 ' + GLOW + 'px rgba(255,255,255,' + glowA.toFixed(3) + ')) ' +
        'blur(' + (lout * 10).toFixed(2) + 'px)';
      logo.style.visibility = lout >= 1 ? 'hidden' : 'visible';

      // 2. Welcome: letters rise in out of a blur, then ease into wider spacing as they fade
      letterEls.forEach(function (el, i) {
        var a = easeOut(span(WELCOME_AT + LETTER_STAGGER * i, LETTER_DUR));
        el.style.opacity = a;
        el.style.transform = 'translateY(' + ((1 - a) * 40) + '%)';
        el.style.filter = 'blur(' + ((1 - a) * 8).toFixed(2) + 'px)';
      });
      var wOut = span(WELCOME_OUT_AT, WELCOME_OUT);
      var wSpread = easeInOutSine(wOut);
      welcome.style.opacity = (1 - easeIn(wOut)).toFixed(3);
      var ls = (0.12 + 0.3 * wSpread).toFixed(4) + 'em';
      welcome.style.letterSpacing = ls;
      welcome.style.paddingLeft = ls;
      welcome.style.filter = 'blur(' + (wOut * 6).toFixed(2) + 'px)';
      welcome.style.visibility = wOut >= 1 ? 'hidden' : 'visible';
    }

    function scrollPos() {
      return window.pageYOffset || document.documentElement.scrollTop || document.body.scrollTop || 0;
    }

    function setTracking(link, w) {
      var t = 'calc(var(--tracking) + ' + (EXTRA_TRACKING * w).toFixed(4) + 'em)';
      link.style.letterSpacing = t;
      link.style.paddingLeft = t;
    }

    function measure() {
      var vh = window.innerHeight;
      links.forEach(function (link) { setTracking(link, 0); });
      var avail = Math.max(0, vh * 0.92 - nav.offsetHeight);

      links.forEach(function (link, j) {
        hs[j] = link.offsetHeight;
        var fs = parseFloat(getComputedStyle(link).fontSize) || 0;
        var chars = link.textContent.length + 1;
        var widthAtFull = link.offsetWidth + chars * EXTRA_TRACKING * fs;
        var fitW = (stage.clientWidth * 0.95) / widthAtFull;
        var fitH = 1 + avail / hs[j];
        smax[j] = Math.max(1, Math.min(MAX_SCALE, fitW, fitH));
      });
      cur = null;
    }

    function pin() {
      var rect = wrap.getBoundingClientRect();
      var vh = window.innerHeight;

      if (!useFixed && rect.top < -5 && rect.bottom > vh + 5) {
        if (Math.abs(stage.getBoundingClientRect().top) > 2) {
          useFixed = true;
          wrap.classList.add('use-fixed');
        }
      }
      if (useFixed) {
        stage.classList.toggle('is-pinned', rect.top <= 0 && rect.bottom >= vh);
        stage.classList.toggle('is-after', rect.bottom < vh);
      }
    }

    function target() {
      var rect = wrap.getBoundingClientRect();
      var vh = window.innerHeight;
      var y = scrollPos();

      var top = rect.top + y;
      var begin = Math.max(0, top - vh);
      var end = top + rect.height - vh;
      if (end <= begin) end = begin + 1;

      var progress = Math.min(1, Math.max(0, (y - begin) / (end - begin)));
      var raw = Math.min(N - 1, progress * (N + 0.3) - 1);

      var base = Math.floor(raw);
      var f = raw - base;
      var eased;

      if (base === -1) {
        eased = easeOut(clamp01(f / (1 - HOLD / 2)));
      } else {
        var g = clamp01((f - HOLD / 2) / (1 - HOLD));
        eased = g * g * g * (g * (g * 6 - 15) + 10);
      }
      return Math.min(N - 1, base + eased);
    }

    /* ---------- hero grid: flies in after Welcome, moves out as you scroll, then the words float in ---------- */
    var HERO = wrap.querySelector('.eg3-hero'), heroBg = wrap.querySelector('.eg3-hero-bg'), hint = wrap.querySelector('.eg3-scrollhint');
    var heroParts = HERO ? Array.prototype.slice.call(HERO.children) : [];
    var HERO_OUT = 0.6;                // share of the first scroll step the grid takes to leave
    function renderHero(started) {
      if (!HERO) return 1;
      var out = easeInOut(clamp01(started / HERO_OUT));
      var vw = window.innerWidth, vh = window.innerHeight;
      heroParts.forEach(function (el, i) {
        var inn = introDone ? 1 : easeOut(span(WORDS_AT + i * 90, 900));
        var hx = +el.getAttribute('data-hx') || 0, hy = +el.getAttribute('data-hy') || 0;
        var main = el.hasAttribute('data-main');
        var tx = hx * vw * 0.5 * out, ty = hy * vh * 0.45 * out + (1 - inn) * 40;
        var sc = (main ? 1 + 0.35 * out : 1 - 0.1 * out) * (0.96 + 0.04 * inn);
        el.style.transform = 'translate(' + tx.toFixed(1) + 'px,' + ty.toFixed(1) + 'px) scale(' + sc.toFixed(4) + ')';
        el.style.opacity = (inn * (1 - (main ? clamp01(out * 1.4 - 0.3) : out))).toFixed(3);
      });
      HERO.style.pointerEvents = out > 0.4 || (!introDone && span(WORDS_AT, 600) < 1) ? 'none' : 'auto';
      if (heroBg) heroBg.style.opacity = (1 - out).toFixed(3);
      if (hint) hint.style.opacity = ((introDone ? 1 : span(WORDS_AT + 900, 600)) * (1 - clamp01(out * 4))).toFixed(3);
      return easeOut(clamp01((started - HERO_OUT * 0.55) / 0.5));
    }

    // fill the tiles: header loops, a featured video, and the 3D camera
    function putMedia(box, url) {
      if (!box || !real(url)) return;
      box.innerHTML = '';
      if (EG3.isVideo && EG3.isVideo(url)) {
        var v = document.createElement('video');
        v.muted = true; v.loop = true; v.autoplay = true; v.playsInline = true; v.setAttribute('playsinline', ''); v.preload = 'metadata';
        v.className = 'h-fill'; v.src = url; box.appendChild(v); v.play && v.play().catch(function () {});
        box.style.background = 'none';
      } else box.style.backgroundImage = 'url("' + url + '")';
    }
    EG3.media(function (map) {
      Array.prototype.forEach.call(wrap.querySelectorAll('.eg3-hero [data-slot]'), function (b) { putMedia(b, map[b.getAttribute('data-slot')]); });
    });



    function render(p) {
      renderIntro();

      var es = [], ws = [], total = 0;
      links.forEach(function (link, j) {
        var w = Math.max(0, 1 - Math.abs(p - j));
        ws[j] = w;
        es[j] = hs[j] * (smax[j] - 1) * w;
        total += es[j];
      });

      var started = Math.min(1, Math.max(0, p + 1));
      var restOpacity = 1 - (1 - DIM) * started;
      var bIn = introDone ? 1 : easeInOut(span(BASE_AT, BASE_DUR));
      var vw = window.innerWidth;
      var wordsIn = renderHero(started);

      shade.style.opacity = bIn;

      if (baseLayer) {
        baseLayer.style.opacity = (1 - started) * bIn;
        var zoom = (1 + 0.06 * started) * (1 + INTRO_ZOOM * (1 - bIn));
        baseLayer.style.transform = 'scale(' + zoom + ')';
      }

      var acc = 0;
      links.forEach(function (link, j) {
        var w = ws[j];
        var s = 1 + (smax[j] - 1) * w;
        var ty = acc + es[j] / 2 - total / 2;
        acc += es[j];

        var a = introWord(j);
        var side = j % 2 === 0 ? -1 : 1;
        var ox = side * vw * FLY_DISTANCE * (1 - a);

        var fin = HERO ? wordsIn : 1;
        link.style.transform = 'translateX(' + ox + 'px) translateY(' + (ty + (1 - fin) * 60) + 'px) scale(' + s + ')';
        link.style.opacity = Math.max(w, restOpacity) * a * fin;
        link.style.pointerEvents = a > 0.5 && fin > 0.6 ? 'auto' : 'none';
        setTracking(link, w);
        link.classList.toggle('is-blend', w >= BLEND_AT);

        var layer = layers[j];
        if (layer) {
          layer.style.opacity = w * bIn;
          layer.style.transform = 'scale(' + (1.06 - 0.06 * w) + ')';

          var showing = w * bIn > 0.02;
          if (RESTART_GIFS && showing && !wasShowing[j]) restartGif(j);
          wasShowing[j] = showing;
        }
      });
    }

    function tick() {
      var t = target();
      if (cur === null) cur = t;
      cur += (t - cur) * SMOOTH;
      if (Math.abs(t - cur) < 0.0005) cur = t;
      render(cur);
      if (cur !== t) {
        requestAnimationFrame(tick);
      } else {
        running = false;
      }
    }

    function kick() {
      if (running) return;
      running = true;
      requestAnimationFrame(tick);
    }

    /* ---------- Run the opening sequence ---------- */
    var seenBefore = false;
    if (FULL_INTRO_ONCE) {
      try { seenBefore = localStorage.getItem('eg3IntroSeenV2') === '1'; } catch (e) {}
      try { localStorage.setItem('eg3IntroSeenV2', '1'); } catch (e) {}
    }
    // repeat visits and skips land right after Welcome is gone
    var startOffset = seenBefore ? WELCOME_GONE : 0;

    function skipAhead() {
      if (introDone || introStart === null) return;
      if (elapsed() < WELCOME_GONE) introStart = performance.now() - WELCOME_GONE;
    }
    ['wheel', 'touchstart', 'keydown', 'mousedown'].forEach(function (evt) {
      window.addEventListener(evt, skipAhead, { passive: true });
    });

    function introLoop() {
      if (cur === null) cur = target();
      if (!introDone && introStart !== null && elapsed() >= INTRO_TOTAL) introDone = true;
      render(cur);
      if (!introDone) requestAnimationFrame(introLoop);
    }

    function startIntro() {
      if (introStart !== null || introDone) return;
      introStart = performance.now() - startOffset;
    }

    if (!introDone) {
      if (seenBefore && real(baseUrl)) {
        var img = new Image();
        img.onload = startIntro;
        img.onerror = startIntro;
        img.src = baseUrl;
        if (img.complete) startIntro();
        setTimeout(startIntro, 2000);
      } else if (document.fonts && document.fonts.ready) {
        document.fonts.ready.then(startIntro);
        setTimeout(startIntro, 1500);
      } else {
        startIntro();
      }
      requestAnimationFrame(introLoop);
    } else {
      intro.style.display = 'none';
    }

    window.addEventListener('scroll', function () { pin(); kick(); }, { passive: true });
    window.addEventListener('resize', function () { measure(); pin(); kick(); });
    window.addEventListener('load', function () { measure(); pin(); kick(); loadGifCopies(); });
    if (document.fonts && document.fonts.ready) {
      document.fonts.ready.then(function () { measure(); kick(); });
    }

    measure();
    pin();
    kick();
  })();
</script>
