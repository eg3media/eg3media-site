<!-- EG3 animated background: dark gray, 35mm grain, flowing topo lines.
     Paste this as its own Code block under the landing page's main code block. -->
<style>
  .eg3c { background: transparent !important; }
  .eg3c > *:not(.eg3bg) { position: relative; z-index: 1; }
  /* the topo layer covers every section on the page, down to the footer */
  .eg3bg-host { position: relative; }
  .eg3bg-host .section-border,
  .eg3bg-host .section-background { display: none !important; }
  .eg3bg-host .page-section { background: transparent !important; }
  .eg3bg-host > .page-section { position: relative; z-index: 1; }
  .eg3bg {
    position: absolute;
    inset: 0;
    z-index: 0;
    overflow: hidden;
    pointer-events: none;
    background: #1c1c1c;
  }
  .eg3c-intro canvas.eg3bg-canvas {
    position: absolute !important;
    inset: 0;
    width: 100% !important;
    height: 100% !important;
    z-index: 0;
    transform: none !important;
  }
  .eg3bg canvas {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100vh;
    display: block;
    will-change: transform;
  }
</style>

<script>
(function () {
  /* ========= SETTINGS ========= */
  var BASE = [0.110, 0.110, 0.110];   // background gray (0 = black, 1 = white)
  var LINE = [0.42, 0.42, 0.42];      // topo line gray
  var LINE_STRENGTH = 0.7;            // how visible the lines are (0 to 1)
  var LINE_COUNT = 5.0;               // more = tighter contour lines
  var MAP_SCALE = 0.6;                // bigger = more hills on screen
  var FLOW_SPEED = 0.035;             // resting drift speed
  var SCROLL_BOOST = 0.0025;          // how much scrolling speeds it up
  var GRAIN = 0.075;                  // film grain strength
  var DRAW_MS = 1400;                 // how long the lines take to draw on during the intro
  var GLOW_FADE_MS = 1000;            // how long the glow takes to settle to gray
  /* ============================ */

  function start() {
    var root = document.getElementById('eg3c');
    if (!root || document.querySelector('.eg3bg')) return;

    var layer = document.createElement('div');
    layer.className = 'eg3bg';
    layer.setAttribute('aria-hidden', 'true');
    var canvas = document.createElement('canvas');
    canvas.className = 'eg3bg-canvas';
    layer.appendChild(canvas);
    // put the layer behind all page sections (not just this block) so no black shows above the footer
    var host = document.getElementById('sections') || root.closest('.page-section') || root;
    if (host !== root) host.classList.add('eg3bg-host');
    host.insertBefore(layer, host.firstChild);

    var gl = canvas.getContext('webgl', { antialias: false, premultipliedAlpha: false });
    if (!gl) return;                     // no WebGL: plain dark gray stays
    var deriv = gl.getExtension('OES_standard_derivatives');

    var vert = 'attribute vec2 p; void main(){ gl_Position = vec4(p, 0.0, 1.0); }';
    var frag = (deriv ? '#extension GL_OES_standard_derivatives : enable\n' : '') + [
      'precision highp float;',
      'uniform vec2 res; uniform float t; uniform float gt;',
      'uniform vec3 base; uniform vec3 lineCol;',
      'uniform float strength; uniform float levels; uniform float scale; uniform float grain;',
      'uniform float reveal; uniform float glow;',
      'vec3 mod289(vec3 x){ return x - floor(x * (1.0/289.0)) * 289.0; }',
      'vec2 mod289(vec2 x){ return x - floor(x * (1.0/289.0)) * 289.0; }',
      'vec3 permute(vec3 x){ return mod289(((x*34.0)+1.0)*x); }',
      'float snoise(vec2 v){',
      '  const vec4 C = vec4(0.211324865405187, 0.366025403784439, -0.577350269189626, 0.024390243902439);',
      '  vec2 i = floor(v + dot(v, C.yy)); vec2 x0 = v - i + dot(i, C.xx);',
      '  vec2 i1 = (x0.x > x0.y) ? vec2(1.0, 0.0) : vec2(0.0, 1.0);',
      '  vec4 x12 = x0.xyxy + C.xxzz; x12.xy -= i1; i = mod289(i);',
      '  vec3 p = permute(permute(i.y + vec3(0.0, i1.y, 1.0)) + i.x + vec3(0.0, i1.x, 1.0));',
      '  vec3 m = max(0.5 - vec3(dot(x0,x0), dot(x12.xy,x12.xy), dot(x12.zw,x12.zw)), 0.0);',
      '  m = m*m; m = m*m;',
      '  vec3 x = 2.0 * fract(p * C.www) - 1.0; vec3 h = abs(x) - 0.5;',
      '  vec3 ox = floor(x + 0.5); vec3 a0 = x - ox;',
      '  m *= 1.79284291400159 - 0.85373472095314 * (a0*a0 + h*h);',
      '  vec3 g; g.x = a0.x * x0.x + h.x * x0.y; g.yz = a0.yz * x12.xz + h.yz * x12.yw;',
      '  return 130.0 * dot(m, g);',
      '}',
      'float fbm(vec2 p){ float v = 0.0; float a = 0.5;',
      '  for (int i = 0; i < 2; i++){ v += a * snoise(p); p = p * 2.02 + vec2(1.7, 9.2); a *= 0.5; }',
      '  return v; }',
      'float hash(vec2 p){ p = fract(p * vec2(443.897, 441.423)); p += dot(p, p.yx + 19.19); return fract((p.x + p.y) * p.x); }',
      'void main(){',
      '  vec2 uv = gl_FragCoord.xy / res.y * scale;',
      '  vec2 warp = vec2(fbm(uv * 0.6 + vec2(t * 0.6, -t * 0.4)), fbm(uv * 0.6 + vec2(5.2 - t * 0.5, 1.3 + t * 0.3)));',
      '  float h = fbm(uv + warp * 0.9 + vec2(t * 0.25, t * 0.15));',
      '  float v = h * levels;',
      '  float f = fract(v); float d = min(f, 1.0 - f);',
      deriv ? '  float w = fwidth(v) * 1.1;' : '  float w = 0.06;',
      '  float line = 1.0 - smoothstep(0.0, w, d);',
      '  float halo = 1.0 - smoothstep(0.0, w * 7.0, d);',
      '  float lvl = floor(v + 0.5);',
      '  float major = step(4.5, mod(lvl, 5.0));',
      '  vec2 q = gl_FragCoord.xy / res;',
      '  vec2 c = (q - 0.5) * vec2(res.x / res.y, 1.0);',
      // draw-on: lines grow outward from the middle, each contour a little offset
      '  float thr = length(c) * 0.95 + fract(sin(lvl * 12.9898) * 43758.5453) * 0.3;',
      '  float front = reveal * 1.45;',
      '  float shown = smoothstep(thr, thr + 0.05, front);',
      '  float tip = exp(-abs(front - thr) * 22.0) * step(reveal, 0.999);',
      '  float amt = line * shown * mix(strength * mix(0.7, 1.25, major), 1.0, glow);',
      '  amt += halo * shown * glow * 0.3 + line * tip * 1.2;',
      '  vec3 lc = mix(lineCol, vec3(1.0), glow);',
      '  vec3 bc = base * (1.0 - glow * 0.7);',
      '  vec3 col = mix(bc, lc, clamp(amt, 0.0, 1.0));',
      '  float vig = smoothstep(1.25, 0.35, length(q - 0.5));',
      '  col *= mix(0.78, 1.0, vig);',
      '  float g = hash(floor(gl_FragCoord.xy) + fract(gt) * 1000.0) - 0.5;',
      '  float g2 = hash(floor(gl_FragCoord.xy * 0.5) + fract(gt * 1.37) * 777.0) - 0.5;',
      '  col += (g * 0.7 + g2 * 0.5) * grain;',
      '  gl_FragColor = vec4(col, 1.0);',
      '}'
    ].join('\n');

    function sh(type, src) {
      var s = gl.createShader(type);
      gl.shaderSource(s, src);
      gl.compileShader(s);
      if (!gl.getShaderParameter(s, gl.COMPILE_STATUS)) { console.warn(gl.getShaderInfoLog(s)); return null; }
      return s;
    }
    var vs = sh(gl.VERTEX_SHADER, vert), fs = sh(gl.FRAGMENT_SHADER, frag);
    if (!vs || !fs) return;
    var prog = gl.createProgram();
    gl.attachShader(prog, vs);
    gl.attachShader(prog, fs);
    gl.linkProgram(prog);
    gl.useProgram(prog);

    var buf = gl.createBuffer();
    gl.bindBuffer(gl.ARRAY_BUFFER, buf);
    gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1, -1, 3, -1, -1, 3]), gl.STATIC_DRAW);
    var loc = gl.getAttribLocation(prog, 'p');
    gl.enableVertexAttribArray(loc);
    gl.vertexAttribPointer(loc, 2, gl.FLOAT, false, 0, 0);

    function U(n) { return gl.getUniformLocation(prog, n); }
    var uRes = U('res'), uT = U('t'), uGt = U('gt'), uReveal = U('reveal'), uGlow = U('glow');
    gl.uniform3fv(U('base'), BASE);
    gl.uniform3fv(U('lineCol'), LINE);
    gl.uniform1f(U('strength'), LINE_STRENGTH);
    gl.uniform1f(U('levels'), LINE_COUNT);
    gl.uniform1f(U('scale'), MAP_SCALE);
    gl.uniform1f(U('grain'), GRAIN);

    function size() {
      var dpr = Math.min(window.devicePixelRatio || 1, 1.5);
      var w = Math.round(window.innerWidth * dpr), h = Math.round(window.innerHeight * dpr);
      if (canvas.width !== w || canvas.height !== h) {
        canvas.width = w; canvas.height = h;
        gl.viewport(0, 0, w, h);
        gl.uniform2f(uRes, w, h);
      }
    }
    size();
    window.addEventListener('resize', size);

    // keep the canvas pinned to the screen while the page scrolls
    function pin() {
      var r = host.getBoundingClientRect();
      var y = Math.min(Math.max(0, -r.top), Math.max(0, r.height - window.innerHeight));
      canvas.style.transform = 'translate3d(0,' + y + 'px,0)';
    }

    var reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

    // intro: draw the lines on (glowing) behind the page title, then settle to gray
    var overlay = document.getElementById('eg3c-intro');
    var introWord = document.getElementById('eg3c-word');
    var introGif = document.getElementById('eg3c-gif');
    var inIntro = !!(overlay && overlay.isConnected && !reduce);
    var reveal = inIntro ? 0 : 1, glow = inIntro ? 1 : 0;
    var drawStart = null, fadeStart = null;
    if (inIntro) overlay.insertBefore(canvas, overlay.firstChild);

    function ease(t) { return t < 0.5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2; }
    function introStep(now) {
      if (!inIntro) return;
      var first = introWord && introWord.firstChild;
      if (drawStart === null && first && first.style && parseFloat(first.style.opacity) > 0.01) drawStart = now;
      if (drawStart !== null) reveal = ease(Math.min(1, (now - drawStart) / DRAW_MS));
      var wordFading = introWord && drawStart !== null && parseFloat(introWord.style.opacity) < 0.97;
      if (fadeStart === null && (wordFading || (drawStart !== null && now - drawStart > DRAW_MS + 600))) fadeStart = now;
      if (fadeStart !== null) glow = 1 - ease(Math.min(1, (now - fadeStart) / GLOW_FADE_MS));
      // once the GIF covers the screen (or the intro is gone), move the lines back behind the page
      var gifFull = introGif && parseFloat(introGif.style.opacity) >= 0.98;
      if (!overlay.isConnected || (gifFull && glow <= 0.001)) {
        layer.insertBefore(canvas, layer.firstChild);
        reveal = 1; glow = 0; inIntro = false;
      }
    }
    var flow = Math.random() * 100, boost = 0, lastY = window.pageYOffset, last = performance.now();
    var grainClock = 0, grainStep = 0;

    function frame(now) {
      var dt = Math.min(0.1, (now - last) / 1000);
      last = now;
      var y = window.pageYOffset || document.documentElement.scrollTop || 0;
      var v = Math.abs(y - lastY) / Math.max(dt, 0.001);   // scroll speed, px per second
      lastY = y;
      boost += (Math.min(v * SCROLL_BOOST, 2.5) - boost) * 0.08;
      flow += dt * FLOW_SPEED * (1 + boost * 6) * (reduce ? 0.2 : 1);

      // grain changes 24 times a second, like film
      grainClock += dt;
      if (grainClock > 1 / 24) { grainClock = 0; grainStep += 0.6180339; }

      introStep(now);
      if (!inIntro) pin();
      gl.uniform1f(uReveal, reveal);
      gl.uniform1f(uGlow, glow);
      gl.uniform1f(uT, flow);
      gl.uniform1f(uGt, reduce ? 0 : grainStep);
      gl.drawArrays(gl.TRIANGLES, 0, 3);
      requestAnimationFrame(frame);
    }
    requestAnimationFrame(frame);
  }

  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', start);
  else start();
  setTimeout(start, 300);
})();
</script>
