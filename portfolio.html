<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Portfolio | EG3 Media</title>
<meta name="description" content="Commercial, content, sports and real estate video work from EG3 Media in Abilene, Texas.">
<link rel="canonical" href="https://www.eg3media.com/portfolio">
<meta property="og:type" content="website">
<meta property="og:site_name" content="EG3 Media">
<meta property="og:title" content="Portfolio | EG3 Media">
<meta property="og:description" content="Commercial, content, sports and real estate video work from EG3 Media in Abilene, Texas.">
<meta property="og:url" content="https://www.eg3media.com/portfolio">
<meta property="og:image" content="https://www.eg3media.com/media/share.jpg">
<meta name="twitter:card" content="summary_large_image">
<meta name="theme-color" content="#000000">
<link rel="icon" href="/assets/favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Anton&display=swap">
<link rel="stylesheet" href="/assets/site.css">
<script src="/assets/eg3-data.js"></script>
</head>
<body>
<main id="main"><div id="sections">
<div class="eg3-pintro" id="eg3-pintro"><div class="eg3-pintro-word" id="eg3-pintro-word">Portfolio</div></div>

<h1 class="eg3-sr">EG3 Media Portfolio: Abilene, Texas Video Production and Photography</h1>

<nav class="eg3-filters" id="eg3-filters" hidden></nav>

<div class="eg3-grid" id="eg3-grid"></div>

<style>
  @import url('https://fonts.googleapis.com/css2?family=Anton&display=swap');

  html, body { overflow-x: clip; }

  .eg3-grid {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 0;
    background: #000;
    width: 100vw;
    margin-left: calc(50% - 50vw);
  }
  @media (max-width: 1024px) { .eg3-grid { grid-template-columns: repeat(2, 1fr); } }
  @media (max-width: 640px)  { .eg3-grid { grid-template-columns: 1fr; } }

  .eg3-tile {
    position: relative;
    display: block;
    aspect-ratio: 16 / 9;
    overflow: hidden;
    background: #111;
    text-decoration: none !important;
    cursor: pointer;
  }
  .eg3-tile img,
  .eg3-tile video {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    object-fit: cover;
    pointer-events: none;
    transition: transform .6s ease, filter .4s ease, opacity .4s ease;
  }
  .eg3-tile img { filter: brightness(0.8); }
  .eg3-tile video { opacity: 0; }
  .eg3-tile.is-playing video,
  .eg3-tile.has-poster video { opacity: 1; }

  /* grow on hover */
  .eg3-tile:hover img,
  .eg3-tile:hover video { transform: scale(1.05); filter: brightness(1); }

  .eg3-tile span {
    position: absolute;
    left: 0;
    bottom: 0;
    z-index: 2;
    padding: 16px 20px;
    font-family: 'Anton', sans-serif;
    font-size: clamp(18px, 2vw, 30px);
    line-height: 1;
    text-transform: uppercase;
    color: #fff;
    mix-blend-mode: difference;
    opacity: 0;
    transform: translateY(8px);
    transition: opacity .3s ease, transform .3s ease;
    pointer-events: none;
  }
  .eg3-tile:hover span { opacity: 1; transform: none; }
  .eg3-tile:not(:has(img)):not(.is-playing) span { opacity: 1; transform: none; }

  .eg3-filters {
    display: flex;
    justify-content: center;
    padding: 36px 16px 32px;
    background: #000;
    width: 100vw;
    margin-left: calc(50% - 50vw);
    box-sizing: border-box;
    overflow-x: auto;
    scrollbar-width: none;
  }
  .eg3-filters::-webkit-scrollbar { display: none; }
  .eg3-filters[hidden] { display: none; }

  .eg3-tabs {
    position: relative;
    display: flex;
    flex-wrap: nowrap;
    align-items: flex-end;
    gap: clamp(20px, 4vw, 56px);
    padding: 0 clamp(12px, 3vw, 40px) 22px;
  }
  .eg3-tabs button {
    appearance: none;
    background: none;
    border: 0;
    padding: 0;
    cursor: pointer;
    white-space: nowrap;
    font-family: 'Anton', sans-serif;
    font-size: clamp(16px, 2vw, 28px);
    line-height: 1;
    letter-spacing: .02em;
    text-transform: uppercase;
    color: #fff;
    opacity: .35;
    transform-origin: 50% 100%;
    transition: opacity .35s ease, transform .45s cubic-bezier(.65, 0, .35, 1);
  }
  .eg3-tabs button:hover { opacity: .7; }
  .eg3-tabs button.is-active { opacity: 1; transform: scale(1.3); }

  /* the line */
  .eg3-line {
    position: absolute;
    left: 0;
    right: 0;
    bottom: 0;
    height: 1px;
    background: rgba(255, 255, 255, .3);
  }
  /* the dot */
  .eg3-dot {
    position: absolute;
    left: 0;
    bottom: 0;
    width: 9px;
    height: 9px;
    margin: 0 0 -4px -4.5px;
    border-radius: 50%;
    background: #fff;
    box-shadow: 0 0 10px rgba(255, 255, 255, .6);
  }
  .eg3-dot { transition: opacity .35s ease, transform .5s cubic-bezier(.34, 1.56, .64, 1); }
  .eg3-dot.is-animated {
    transition: left .6s cubic-bezier(.65, 0, .35, 1), opacity .35s ease, transform .5s cubic-bezier(.34, 1.56, .64, 1);
  }
  .eg3-line { transform-origin: 0 50%; transition: transform .9s cubic-bezier(.65, 0, .35, 1); }

  /* ---- intro states ---- */
  .eg3-tabs.pre button { opacity: 0 !important; }
  .eg3-tabs.noline .eg3-line { transform: scaleX(0); }
  .eg3-tabs.noactive button.is-active { opacity: .35; transform: none; }
  .eg3-tabs.noactive .eg3-dot { opacity: 0; transform: scale(0); }
  .eg3-tabs button.menu-in { animation: eg3MenuIn .7s cubic-bezier(.2, .7, .2, 1) backwards; }
  @keyframes eg3MenuIn { from { opacity: 0; translate: -28px 0; } }

  .eg3-grid.pre .eg3-tile { opacity: 0; }
  .eg3-tile.float {
    animation: eg3Float 1s cubic-bezier(.2, .7, .2, 1) backwards;
    animation-delay: var(--d, 0s);
  }
  @keyframes eg3Float {
    from { opacity: 0; translate: var(--dx, 0) var(--dy, 40px); scale: .9; }
  }

  /* ---- black screen intro (same moves as the homepage Welcome) ---- */
  .eg3-pintro {
    position: fixed;
    inset: 0;
    z-index: 2147483000;
    display: flex;
    align-items: center;
    justify-content: center;
    background: #000;
    pointer-events: none;
    /* safety: never leave the screen black if something goes wrong */
    animation: eg3Failsafe 0s 7s forwards;
  }
  @keyframes eg3Failsafe { to { opacity: 0; visibility: hidden; } }
  .eg3-pintro-word,
  .eg3-pintro-word span { transition: none !important; animation: none !important; }
  .eg3-pintro-word {
    margin: 0;
    font-family: 'Anton', 'Impact', sans-serif !important;
    font-weight: 400 !important;
    font-size: clamp(2.6rem, 11vw, 10rem);
    line-height: 1;
    letter-spacing: 0.12em;
    padding-left: 0.12em;
    text-transform: uppercase;
    white-space: nowrap;
    color: #fff !important;
    opacity: 0;
    will-change: opacity, letter-spacing;
  }
  .eg3-pintro-word span {
    display: inline-block;
    opacity: 0;
    will-change: transform, opacity, filter;
  }

  .eg3-tile.is-hidden { display: none; }
  .eg3-tile.is-in { animation: eg3In .45s ease both; }
  @keyframes eg3In { from { opacity: 0; } to { opacity: 1; } }

  .eg3-debug2 {
    position: absolute; right: 8px; bottom: 8px; z-index: 3; max-width: 92%;
    font: 11px/1.3 monospace; color: #ff0; background: rgba(0,0,0,.8);
    padding: 3px 6px; pointer-events: none; word-break: break-all;
  }
  .eg3-debug {
    position: absolute; top: 8px; left: 8px; z-index: 3;
    font: 12px/1.3 monospace; color: #0f0; background: rgba(0,0,0,.75);
    padding: 3px 6px; pointer-events: none;
  }

  /* heading for search engines and screen readers (not shown on screen) */
  .eg3-sr {
    position: absolute !important; width: 1px !important; height: 1px !important;
    padding: 0 !important; margin: -1px !important; overflow: hidden !important;
    clip: rect(0 0 0 0) !important; white-space: nowrap !important; border: 0 !important;
  }
</style>

<script>
(function () {
  // true = every video plays on its own while on screen (hover still grows it)
  // false = videos play on hover (phones still play whatever is on screen)
  var ALWAYS_AUTOPLAY = false;

  // true = plays the black "PORTFOLIO" intro every time the page opens
  var INTRO = true;

  // intro timing in milliseconds (matches the homepage Welcome)
  var LETTER_STAGGER = 80;   // delay between letters
  var LETTER_DUR = 600;      // how long each letter takes to rise in
  var WORD_HOLD = 320;       // wait after the last letter starts before it widens
  var WORD_OUT = 700;        // widen and fade
  var SCREEN_OUT = 600;      // black screen fades away

  // true = shows a small green status label on each tile so we can see what's failing.
  // Set to false once it's working.
  var DEBUG = false;

  var grid = document.getElementById('eg3-grid');
  if (!grid || grid.dataset.ready) return;
  grid.dataset.ready = '1';

  var canHover = window.matchMedia('(hover: hover) and (pointer: fine)').matches;
  var useHover = canHover && !ALWAYS_AUTOPLAY;
  var hlsReady = null;

  function status(tile, msg) {
    if (!DEBUG) return;
    var el = tile.querySelector('.eg3-debug');
    if (!el) { el = document.createElement('div'); el.className = 'eg3-debug'; tile.appendChild(el); }
    el.textContent = msg;
  }

  function loadHls() {
    if (window.Hls) return Promise.resolve(window.Hls);
    if (hlsReady) return hlsReady;
    hlsReady = new Promise(function (resolve) {
      var s = document.createElement('script');
      s.src = 'https://cdn.jsdelivr.net/npm/hls.js@1/dist/hls.min.js';
      s.onload = function () { resolve(window.Hls || null); };
      s.onerror = function () { resolve(null); };
      document.head.appendChild(s);
    });
    return hlsReady;
  }




  var POSTER_AT = 1.5;   // seconds into the video used as the still for tiles without a thumbnail
  var posterIO = 'IntersectionObserver' in window ? new IntersectionObserver(function (entries) {
    entries.forEach(function (e) {
      if (e.isIntersecting && e.target._prime) { e.target._prime(); posterIO.unobserve(e.target); }
    });
  }, { rootMargin: '400px 0px' }) : null;

  function wire(tile, base, file) {
    var video = null;
    var wantPlay = false;
    var triedFile = false;
    var primed = false;
    var timer;

    status(tile, 'ready (' + (base ? 'stream' : '') + (base && file ? '+' : '') + (file ? 'file' : '') + ')');

    function makeVideo() {
      video = document.createElement('video');
      video.muted = true;
      video.defaultMuted = true;
      video.loop = true;
      video.playsInline = true;
      video.setAttribute('muted', '');
      video.setAttribute('playsinline', '');
      video.setAttribute('preload', 'auto');
      tile.insertBefore(video, tile.querySelector('span'));
      video.addEventListener('playing', function () {
        status(tile, 'playing');
        if (wantPlay) tile.classList.add('is-playing');
      });
      video.addEventListener('error', function () {
        status(tile, 'video error ' + (video.error ? video.error.code : ''));
        useFile();
      });
      // still frame for tiles with no thumbnail
      video.addEventListener('loadedmetadata', function () {
        if (primed || wantPlay || !(tile._v && tile._v.frameThumb)) return;
        primed = true;
        try { video.currentTime = Math.min(POSTER_AT, (video.duration || 10) * 0.2); } catch (e) {}
      });
      video.addEventListener('seeked', function () {
        if (tile._v && tile._v.frameThumb) tile.classList.add('has-poster');
      });
    }

    function useFile() {
      if (triedFile || !file) { if (!file) status(tile, 'failed, no file fallback'); return; }
      triedFile = true;
      status(tile, 'trying file');
      if (video && video._hls) { video._hls.destroy(); }
      if (video) video.remove();
      makeVideo();
      video.src = file;
      tryPlay();
    }

    function build() {
      makeVideo();
      if (!base) { useFile(); return; }
      var src = base + '/playlist.m3u8';
      var v = video;
      status(tile, 'loading player');
      loadHls().then(function (Hls) {
        if (v !== video) return;
        if (!Hls || !Hls.isSupported()) {
          // only phones without the player library use the browser's built-in streaming
          if (video.canPlayType('application/vnd.apple.mpegurl')) {
            status(tile, 'loading (native)');
            video.src = src;
            tryPlay();
          } else { status(tile, 'hls.js blocked'); useFile(); }
          return;
        }
        var hls = new Hls({ capLevelToPlayerSize: true });
        video._hls = hls;
        hls.on(Hls.Events.MANIFEST_PARSED, function () { status(tile, 'loaded'); tryPlay(); });
        hls.on(Hls.Events.ERROR, function (e, data) {
          if (data.fatal) { status(tile, 'stream error: ' + data.details); useFile(); }
        });
        hls.loadSource(src);
        hls.attachMedia(video);
      });
    }

    function tryPlay() {
      if (!wantPlay || !video) return;
      var v = video;
      var p = v.play();
      if (p && p.catch) p.catch(function (err) {
        if (v === video && err.name !== 'AbortError') status(tile, 'play blocked: ' + err.name);
      });
    }

    function play() {
      wantPlay = true;
      status(tile, 'hover');
      if (!video) build(); else tryPlay();
    }

    function stop() {
      wantPlay = false;
      clearTimeout(timer);
      tile.classList.remove('is-playing');
      if (video) video.pause();
    }

    tile._stop = stop;
    if (base) {
      tile._prime = function () {
        if (posterIO) { tile._prime = function () { if (!video) build(); }; posterIO.observe(tile); }
        else if (!video) build();
      };
      if (tile._v && tile._v.frameThumb) tile._prime();
    }
    if (useHover) {
      tile.addEventListener('mouseenter', function () { timer = setTimeout(play, 80); });
      tile.addEventListener('mouseleave', stop);
    } else {
      tile._eg3 = { play: play, stop: stop };
    }
  }

  function addThumb(tile, base) {
    if (tile.querySelector('img')) return;
    var img = document.createElement('img');
    img.src = base + '/thumbnail';
    img.alt = '';
    img.onerror = function () { img.remove(); };
    tile.insertBefore(img, tile.firstChild);
  }

  // category buttons, in this order. Categories with no videos are left out.
  var CATEGORY_ORDER = ['Commercial', 'Content', 'Sports', 'Real Estate'];

  function buildFilters(tiles) {
    var bar = document.getElementById('eg3-filters');
    if (!bar) return;
    var found = {};
    tiles.forEach(function (t) { t._cats.forEach(function (c) { found[c] = true; }); });

    var names = CATEGORY_ORDER.filter(function (n) { return found[n.toLowerCase()]; });
    Object.keys(found).forEach(function (c) {
      var known = CATEGORY_ORDER.some(function (n) { return n.toLowerCase() === c; });
      if (!known) names.push(c.replace(/\b\w/g, function (l) { return l.toUpperCase(); }));
    });
    if (!names.length) return null;

    var tabs = document.createElement('div');
    tabs.className = 'eg3-tabs';
    var line = document.createElement('div');
    line.className = 'eg3-line';
    var dot = document.createElement('div');
    dot.className = 'eg3-dot';
    tabs.appendChild(line);
    tabs.appendChild(dot);
    bar.appendChild(tabs);

    function moveDot() {
      var active = tabs.querySelector('button.is-active');
      if (!active) return;
      dot.style.left = (active.offsetLeft + active.offsetWidth / 2) + 'px';
    }

    ['All'].concat(names).forEach(function (name) {
      var b = document.createElement('button');
      b.type = 'button';
      b.textContent = name;
      b.dataset.cat = name === 'All' ? '' : name.toLowerCase();
      b.addEventListener('click', function () { apply(b.dataset.cat, true); });
      tabs.insertBefore(b, line);
    });
    bar.hidden = false;
    window.addEventListener('resize', moveDot);
    if (document.fonts && document.fonts.ready) document.fonts.ready.then(moveDot);

    function apply(cat, fromClick) {
      tabs.querySelectorAll('button').forEach(function (b) {
        b.classList.toggle('is-active', b.dataset.cat === cat);
      });
      moveDot();
      if (!fromClick) requestAnimationFrame(function () { dot.classList.add('is-animated'); });
      var act = tabs.querySelector('button.is-active');
      if (fromClick && act && act.scrollIntoView) act.scrollIntoView({ block: 'nearest', inline: 'center', behavior: 'smooth' });
      tiles.forEach(function (t) {
        var show = !cat || t._cats.indexOf(cat) !== -1;
        if (!show && t._stop) t._stop();
        t.classList.toggle('is-hidden', !show);
        t.classList.remove('is-in');
        if (show && fromClick) { void t.offsetWidth; t.classList.add('is-in'); }
      });
      if (fromClick) {
        try { history.replaceState(null, '', cat ? '#' + cat.replace(/\s+/g, '-') : location.pathname); } catch (e) {}
      }
    }

    // /portfolio#sports opens with Sports selected
    var hash = decodeURIComponent(location.hash.slice(1)).replace(/-/g, ' ').toLowerCase();
    apply(names.some(function (n) { return n.toLowerCase() === hash; }) ? hash : '', false);

    // intro: items float in left to right, line draws, then the active one lights up with the dot
    tabs.classList.add('pre', 'noline', 'noactive');
    return function startMenu() {
      var buttons = tabs.querySelectorAll('button');
      buttons.forEach(function (b, i) {
        b.style.animationDelay = (i * 0.1) + 's';
        b.classList.add('menu-in');
      });
      tabs.classList.remove('pre');
      var lineStart = 150 + buttons.length * 60;
      setTimeout(function () { tabs.classList.remove('noline'); }, lineStart);
      setTimeout(function () { moveDot(); tabs.classList.remove('noactive'); }, lineStart + 850);
      setTimeout(function () {
        buttons.forEach(function (b) { b.classList.remove('menu-in'); b.style.animationDelay = ''; });
      }, 2000);
    };
  }


  /* the still Squarespace shows when a video's page is shared (used when no custom thumbnail is saved) */
  var eg3OgCache = {};
  function eg3PageStill(url) {
    if (!eg3OgCache[url]) {
      eg3OgCache[url] = fetch(url, { credentials: 'same-origin' })
        .then(function (r) { return r.text(); })
        .then(function (html) {
          var m = html.match(/<meta[^>]+property=["']og:image["'][^>]*content=["']([^"']+)["']/i) ||
                  html.match(/<meta[^>]+content=["']([^"']+)["'][^>]*property=["']og:image["']/i);
          if (!m) return null;
          var u = m[1].replace(/&amp;/g, '&').replace(/^http:/, 'https:');
          if (/EG3MEDIA\.png/i.test(u) || /\/(\?|$)/.test(u.split('?')[0] + '?')) return null;   // logo or placeholder
          return u.indexOf('?') === -1 ? u + '?format=1500w' : u;
        })
        .catch(function () { return null; });
    }
    return eg3OgCache[url];
  }

  /* ---------- read everything from /work (titles, thumbnails, videos, categories) ---------- */
  function eg3LoadWork(path) {
    path = path || '/work';
    var items = [], catNames = {}, catList = [];

    function collectCats(obj, depth) {
      if (!obj || typeof obj !== 'object' || depth > 4) return;
      if (Array.isArray(obj.categories)) {
        obj.categories.forEach(function (c) {
          if (c && typeof c === 'object' && c.id && (c.displayName || c.name)) {
            if (!catNames[c.id]) catList.push(c);
            catNames[c.id] = c.displayName || c.name;
          }
        });
      }
      Object.keys(obj).forEach(function (k) {
        if (k !== 'items' && obj[k] && typeof obj[k] === 'object') collectCats(obj[k], depth + 1);
      });
    }

    function getPage(url) {
      return fetch(url, { credentials: 'same-origin' })
        .then(function (r) { return r.json(); })
        .then(function (d) {
          collectCats(d, 0);
          items = items.concat(d.items || []);
          if (d.pagination && d.pagination.nextPage && d.pagination.nextPageUrl) {
            var u = new URL(d.pagination.nextPageUrl, location.origin);
            u.searchParams.set('format', 'json');
            return getPage(u.pathname + u.search);
          }
        });
    }

    function videoBase(it) {
      var sc = it.structuredContent || {};
      var alex = sc.alexandriaUrl || it.alexandriaUrl;
      if (alex) return alex.replace('{variant}', '').replace(/\/$/, '');
      var m = JSON.stringify(it).match(/https?:\/\/video\.squarespace-cdn\.com\/content\/v1\/[\w-]+\/[\w-]+/);
      return m ? m[0] : null;
    }

    function norm(it) {
      var slug = (it.urlId || it.fullUrl || '').split('/').pop();
      var base = videoBase(it);
      var names = [];
      (it.categoryIds || []).forEach(function (id) { if (catNames[id]) names.push(catNames[id]); });
      (it.categories || []).forEach(function (c) {
        if (typeof c === 'string') names.push(catNames[c] || c);
        else if (c && (c.displayName || c.name)) names.push(c.displayName || c.name);
      });
      // custom thumbnail if one is saved; otherwise the still from the video's own page is fetched later
      var thumb = (it.assetUrl || '').replace(/^http:/, 'https:');
      if (/\.(mov|mp4|m4v|webm)(\?|$)/i.test(thumb)) thumb = '';
      if (/\/(\?|$)/.test(thumb)) thumb = '';            // folder with no file = Squarespace placeholder
      if (thumb && thumb.indexOf('?') === -1) thumb += '?format=1500w';
      return {
        slug: slug,
        title: it.title || '',
        url: it.fullUrl || (path + '/v/' + slug),
        base: base,
        thumb: thumb,
        frameThumb: false,
        cats: names.map(function (n) { return String(n).trim().toLowerCase(); }).filter(Boolean)
      };
    }

    return getPage(path + '?format=json').then(function () {
      var list = items.map(norm).filter(function (v) { return v.slug; });
      var anyCats = list.some(function (v) { return v.cats.length; });
      if (anyCats || !catList.length) return list;
      // backup: ask each category page which videos it holds
      return Promise.all(catList.map(function (c) {
        var url = (c.fullUrl || (path + '/' + (c.shortSlug || c.urlId || ''))) + '?format=json';
        return fetch(url, { credentials: 'same-origin' }).then(function (r) { return r.json(); }).then(function (d) {
          var got = (d.items || []);
          if (!got.length || got.length >= items.length) return;   // page isn't filtered, ignore it
          got.forEach(function (it) {
            var s = (it.urlId || it.fullUrl || '').split('/').pop();
            list.forEach(function (v) { if (v.slug === s) v.cats.push(String(c.displayName || c.name).toLowerCase()); });
          });
        }).catch(function () {});
      })).then(function () { return list; });
    });
  }

  function makeTile(v) {
    var a = document.createElement('a');
    a.className = 'eg3-tile';
    a.href = v.url;
    a.dataset.slug = v.slug;
    a._cats = v.cats;
    a._v = v;
    function note(msg) {
      if (!DEBUG) return;
      var el = a.querySelector('.eg3-debug2');
      if (!el) { el = document.createElement('div'); el.className = 'eg3-debug2'; a.appendChild(el); }
      el.textContent = msg;
    }
    function tail(u) { return String(u).split('/').slice(-2).join('/').slice(0, 70); }
    function addImg(src, onFail, kind) {
      var img = document.createElement('img');
      img.src = src;
      img.alt = v.title;
      note(kind + ' loading: ' + tail(src));
      img.onload = function () {
        note(kind + ' OK ' + img.naturalWidth + 'x' + img.naturalHeight + ': ' + tail(src));
        if (img.naturalWidth === img.naturalHeight && img.naturalWidth <= 300) {   // Squarespace placeholder
          note(kind + ' was a placeholder');
          img.remove();
          if (onFail) onFail();
        }
      };
      img.onerror = function () { note(kind + ' FAILED: ' + tail(src)); img.remove(); if (onFail) onFail(); };
      a.insertBefore(img, a.firstChild);
    }
    function useFrame() { note('using video frame'); v.frameThumb = true; if (a._prime) a._prime(); }
    function usePageStill() {
      note('checking page still');
      Promise.resolve(null).then(function (u) { if (u) addImg(u, useFrame, 'page still'); else { note('no page still'); useFrame(); } });
    }
    if (v.thumb) addImg(v.thumb, usePageStill, 'custom'); else usePageStill();
    var t = document.createElement('span');
    t.textContent = v.title;
    a.appendChild(t);
    return a;
  }

  // build the grid from /work, then the menu
  var ready = EG3.work().then(function (list) {
    list.forEach(function (v) { grid.appendChild(makeTile(v)); });
    var tiles = grid.querySelectorAll('.eg3-tile');
    tiles.forEach(function (t) {
      status(t, 'mode: ' + (useHover ? 'hover' : 'autoplay'));
      if (t._v.base || t._v.file) wire(t, t._v.base, t._v.file);
      else status(t, 'no video found');
    });
    var startMenu = buildFilters(tiles);

    if (!useHover && 'IntersectionObserver' in window) {
      var io = new IntersectionObserver(function (entries) {
        entries.forEach(function (e) {
          var c = e.target._eg3;
          if (c) e.isIntersecting ? c.play() : c.stop();
        });
      }, { threshold: 0.5 });
      tiles.forEach(function (t) { io.observe(t); });
    }
    return { tiles: tiles, startMenu: startMenu };
  }).catch(function (err) {
    console.warn('EG3 grid: could not load /work', err);
    return { tiles: [], startMenu: null };
  });

  runIntro(ready);

  function runIntro(ready) {
    var overlay = document.getElementById('eg3-pintro');
    var word = document.getElementById('eg3-pintro-word');
    var reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

    if (!INTRO || reduce || !overlay) {
      if (overlay) overlay.remove();
      ready.then(function () {
        var tabs = document.querySelector('#eg3-filters .eg3-tabs');
        if (tabs) tabs.classList.remove('pre', 'noline', 'noactive');
      });
      return;
    }

    // keep the black screen above everything on the page
    document.body.appendChild(overlay);
    var html = document.documentElement;
    var oldOverflow = html.style.overflow;
    html.style.overflow = 'hidden';
    grid.classList.add('pre');

    // split the word into letters
    var letterEls = word.textContent.trim().split('').map(function (ch) {
      var sp = document.createElement('span');
      sp.textContent = ch === ' ' ? ' ' : ch;
      return sp;
    });
    word.innerHTML = '';
    letterEls.forEach(function (sp) { word.appendChild(sp); });
    word.style.opacity = 1;

    var OUT_AT = LETTER_STAGGER * (letterEls.length - 1) + WORD_HOLD;
    var SCREEN_AT = OUT_AT + WORD_OUT * 0.55;
    var END = SCREEN_AT + SCREEN_OUT;

    function clamp01(x) { return Math.min(1, Math.max(0, x)); }
    function easeOut(t) { return 1 - Math.pow(1 - t, 4); }
    function easeIn(t) { return t * t; }
    function easeInOutSine(t) { return -(Math.cos(Math.PI * t) - 1) / 2; }

    var start = null, contentStarted = false;
    function begin() { if (start === null) { start = performance.now(); requestAnimationFrame(frame); } }

    function frame(now) {
      var e = now - start;
      function span(at, dur) { return clamp01((e - at) / dur); }

      // letters rise in out of a blur
      letterEls.forEach(function (el, i) {
        var a = easeOut(span(LETTER_STAGGER * i, LETTER_DUR));
        el.style.opacity = a;
        el.style.transform = 'translateY(' + ((1 - a) * 40) + '%)';
        el.style.filter = 'blur(' + ((1 - a) * 8).toFixed(2) + 'px)';
      });

      // then the word eases wider and fades
      var wOut = span(OUT_AT, WORD_OUT);
      var ls = (0.12 + 0.3 * easeInOutSine(wOut)).toFixed(4) + 'em';
      word.style.opacity = (1 - easeIn(wOut)).toFixed(3);
      word.style.letterSpacing = ls;
      word.style.paddingLeft = ls;
      word.style.filter = 'blur(' + (wOut * 6).toFixed(2) + 'px)';

      // black screen fades and the page builds in underneath
      overlay.style.opacity = (1 - easeIn(span(SCREEN_AT, SCREEN_OUT))).toFixed(3);
      if (!contentStarted && e >= SCREEN_AT) {
        contentStarted = true;
        html.style.overflow = oldOverflow;
        ready.then(function (r) {
          buildMosaic(r.tiles);
          if (r.startMenu) r.startMenu();
        });
      }

      if (e < END) requestAnimationFrame(frame);
      else overlay.remove();
    }

    // wait for the Anton font so the letters don't jump
    if (document.fonts && document.fonts.ready) document.fonts.ready.then(begin);
    setTimeout(begin, 1500);

    function buildMosaic(tiles) {
      var order = Array.prototype.slice.call(tiles).filter(function (t) {
        return !t.classList.contains('is-hidden');
      });
      // shuffle so they land in a random order
      for (var k = order.length - 1; k > 0; k--) {
        var j = Math.floor(Math.random() * (k + 1));
        var tmp = order[k]; order[k] = order[j]; order[j] = tmp;
      }
      order.forEach(function (t, n) {
        var angle = Math.random() * Math.PI * 2;
        var dist = 40 + Math.random() * 60;
        t.style.setProperty('--dx', Math.round(Math.cos(angle) * dist) + 'px');
        t.style.setProperty('--dy', Math.round(Math.sin(angle) * dist) + 'px');
        t.style.setProperty('--d', (n * 0.07 + Math.random() * 0.15).toFixed(2) + 's');
        t.classList.add('float');
      });
      grid.classList.remove('pre');
      setTimeout(function () {
        order.forEach(function (t) { t.classList.remove('float'); });
      }, 3200);
    }
  }
})();
</script>

<script>
(function () {
  var box = document.createElement('div');
  box.className = 'eg3pl'; box.hidden = true; box.setAttribute('role', 'dialog'); box.setAttribute('aria-modal', 'true');
  box.innerHTML = '<button type="button" aria-label="Close video">&times;</button><video controls playsinline></video><h2></h2>';
  document.body.appendChild(box);
  var vid = box.querySelector('video'), ttl = box.querySelector('h2'), list = [];
  EG3.work().then(function (l) { list = l; fromHash(); });
  function open(slug) {
    var v = list.filter(function (x) { return x.slug === slug; })[0]; if (!v || !v.file) return;
    ttl.textContent = v.title; vid.src = v.file; if (v.thumb) vid.poster = v.thumb;

    var p = vid.play(); if (p && p.catch) p.catch(function () {});
    if (location.hash !== '#v-' + slug) history.replaceState(null, '', '#v-' + slug);
  }
  function close() {
    vid.pause(); box.classList.remove('open'); document.documentElement.classList.remove('eg3pl-lock');
    setTimeout(function () { box.hidden = true; vid.removeAttribute('src'); vid.load(); }, 300);

    if (S.cat === 'sports') return ['type', 'describe', 'coverage', 'extras', 'contact', 'result'];
    if (S.cat === 'content') return ['type', 'describe', 'plan', 'shoot', 'deliver', 'contact', 'result'];
    return ['type', 'describe', 'shoot', 'deliver', 'contact', 'result'];
  }

  /* ---------- the math ---------- */
  function estimate() {
    var items = [], total = 0, per = '';
    function add(label, amt) { items.push(label); total += amt; }
    if (S.cat === 'commercial') {
      var c = S.com, L = lenName(c.len);
      add(c.days + ' ' + L[1].toLowerCase() + ' shoot' + (c.days > 1 ? 's' : '') + ' (' + L[2].toLowerCase() + ')', SHOOT[c.len] * c.days);
      if (c.main !== 'none') add({ basic: 'Main video edit, up to 2 min', standard: 'Main video edit, 2-5 min', premium: 'Main video edit, 5+ min or complex' }[c.main], COM['edit' + c.main.charAt(0).toUpperCase() + c.main.slice(1)]);
      if (c.social) add(c.social + ' social cutdown' + (c.social > 1 ? 's' : ''), c.social * COM.social);
      if (c.testimonial) add(c.testimonial + ' testimonial video' + (c.testimonial > 1 ? 's' : ''), c.testimonial * COM.testimonial);
      if (c.recap) add(c.recap + ' event recap' + (c.recap > 1 ? 's' : ''), c.recap * COM.recap);
      if (c.drone) add('Drone footage', COM.drone);
      if (c.sound) add('Premium sound design', COM.sound);
      if (TURN[c.turn]) add(c.turn === 'rush' ? 'Rush delivery (3-5 days)' : 'Next day delivery', TURN[c.turn]);
    }
    if (S.cat === 'content') {
      var k = S.con, L2 = lenName(k.len), n = 0, vids = 0;
      if (k.days) add(k.days + ' ' + L2[1].toLowerCase() + ' shoot' + (k.days > 1 ? 's' : '') + (k.type === 'retainer' ? ' per ' + FREQ[k.freq][1] : ''), SHOOT[k.len] * k.days);
      [['quick', 'quick-hit video'], ['short', 'short-form video (up to 2 min)'], ['medium', 'medium-form video (3-5 min)'], ['long5', 'long-form video (5+ min)'], ['long10', 'long-form video (10+ min)'], ['long15', 'long-form video (15+ min)']].forEach(function (d) {
        if (/^long/.test(d[0]) && !k.longOn) return;
        var q = k[d[0]]; if (!q) return;
        n += q; vids += q * CON[d[0]];
        add(q + ' ' + d[1].replace('video', q > 1 ? 'videos' : 'video'), q * CON[d[0]]);
      });
      var pct = 0; BULK.forEach(function (t) { if (n >= t[0]) pct = t[1]; });
      if (pct) { var off = vids * pct / 100; total -= off; items.push(pct + '% bulk discount on ' + n + ' videos'); }
      if (k.type === 'once' && TURN[k.turn]) add(k.turn === 'rush' ? 'Rush delivery (3-5 days)' : 'Next day delivery', TURN[k.turn]);
      if (k.type === 'retainer') per = FREQ[k.freq][1];
    }
    if (S.cat === 'sports') {
      var p = S.spo;
      if (p.type === 'games') {
        add(p.games + ' game' + (p.games > 1 ? 's' : '') + ' covered, each with a 60-90 second highlight', p.games * SPO.game);
        if (p.reels) add(p.reels + ' extra highlight reel' + (p.reels > 1 ? 's' : ''), p.reels * SPO.reel);
      } else {
        add({ hype: 'Hype video', senior: 'Senior night video', recruit: 'Recruiting reel', recap: 'Season recap' }[p.project], SPO[p.project]);
      }
      if (TURN[p.turn]) add(p.turn === 'rush' ? 'Rush delivery (3-5 days)' : 'Next day delivery', TURN[p.turn]);
    }
    total = Math.max(0, total);
    var low = r50(total * RANGE_LOW), high = Math.max(low + 50, r50(total * RANGE_HIGH));
    return { items: items, total: total, low: low, high: high, per: per };
  }

  /* ---------- building blocks ---------- */
  function card(group, val, title, sub, from, on) {
    return '<button type="button" class="eg3w-card" data-pick="' + group + '" data-v="' + val + '" aria-pressed="' + !!on + '"><b>' + title + '</b>' + (sub ? '<small>' + sub + '</small>' : '') + (from ? '<span class="from">' + from + '</span>' : '') + '</button>';
  }
  function chip(group, val, label, on) { return '<button type="button" class="eg3w-chip" data-pick="' + group + '" data-v="' + val + '" aria-pressed="' + !!on + '">' + label + '</button>'; }
  function counter(path, title, sub, val, max) {
    return '<div class="eg3w-row' + (val ? '' : ' off') + '"><div class="nm"><b>' + title + '</b>' + (sub ? '<small>' + sub + '</small>' : '') + '</div><output>' + val + '</output>' +
      '<input class="rng" type="range" min="0" max="' + max + '" step="1" value="' + val + '" data-num="' + path + '" aria-label="' + esc(title) + '"></div>';
  }
  function live() { var e = estimate(); return '<div class="eg3w-live" data-live>Running estimate: <b>' + money(e.low) + ' - ' + money(e.high) + '</b>' + (e.per ? ' per ' + e.per : '') + '</div>'; }
  function lengthCards(group, cur) { return '<div class="eg3w-grid">' + LENGTHS.map(function (L) { return card(group, L[0], L[1], L[2], 'From ' + money(SHOOT[L[0]] * RANGE_LOW), cur === L[0]); }).join('') + '</div>'; }
  function turnChips(group, cur) { return '<div class="eg3w-f"><span class="eg3w-label">How fast do you need it?</span><div class="eg3w-chips">' + chip(group, 'standard', 'Standard, 1-2 weeks', cur === 'standard') + chip(group, 'rush', 'Rush, 3-5 days', cur === 'rush') + chip(group, 'nextday', 'Next day', cur === 'nextday') + '</div></div>'; }

  function stepHTML(name) {
    switch (name) {
      case 'type':
        return '<h2 class="eg3w-q">What are we making?</h2><p class="eg3w-sub">Pick the closest fit. You\'ll get a rough price range in about a minute.</p>' +
          '<div class="eg3w-grid">' + card('cat', 'commercial', 'Commercial', 'Brand films, ads, promos, testimonials', '', S.cat === 'commercial') + card('cat', 'content', 'Content', 'Social videos, reels, ongoing content', '', S.cat === 'content') + card('cat', 'sports', 'Sports', 'Game coverage, highlights, hype videos', '', S.cat === 'sports') + '</div>' +
          '<p class="eg3w-note">Real estate listing? <a href="/realestate">Use the real estate price calculator</a>.</p>';
      case 'describe':
        return '<h2 class="eg3w-q">Tell us about it</h2><p class="eg3w-sub">What\'s the project, who\'s it for, and where will it live? A couple sentences is plenty.</p>' +
          '<div class="eg3w-f"><textarea data-text="desc" placeholder="' + ({ commercial: 'e.g. A 60-90 second brand video for our restaurant, plus a few cutdowns for Instagram.', content: 'e.g. We want a few short videos a month for TikTok and Instagram showing our shop and team.', sports: 'e.g. Highlight videos for our varsity football season, 10 home games.' }[S.cat] || '') + '">' + esc(S.desc) + '</textarea></div>';
      case 'plan':
        return '<h2 class="eg3w-q">One time or ongoing?</h2><p class="eg3w-sub">Ongoing content is planned on a regular schedule, and bigger batches get a bulk discount.</p>' +
          '<div class="eg3w-grid">' + card('con.type', 'once', 'One-time shoot', 'A single shoot and a batch of videos', '', S.con.type === 'once') + card('con.type', 'retainer', 'Ongoing content', 'A shoot and new videos on a schedule', '', S.con.type === 'retainer') + '</div>' +
          (S.con.type === 'retainer' ? '<div class="eg3w-f"><span class="eg3w-label">How often?</span><div class="eg3w-chips">' + chip('con.freq', 'monthly', 'Monthly', S.con.freq === 'monthly') + chip('con.freq', 'quarterly', 'Quarterly', S.con.freq === 'quarterly') + '</div></div>' : '');
      case 'shoot':
        var o = S.cat === 'content' ? S.con : S.com, pre = S.cat === 'content' ? 'con' : 'com';
        return '<h2 class="eg3w-q">How long is the shoot?</h2><p class="eg3w-sub">' + (S.cat === 'content' && S.con.type === 'retainer' ? 'Per ' + FREQ[S.con.freq][1] + '. ' : '') + 'Not sure? Pick your best guess. We\'ll firm it up together.</p>' +
          lengthCards(pre + '.len', o.len) +
          counter(pre + '.days', S.cat === 'content' && S.con.type === 'retainer' ? 'Shoot days per ' + FREQ[S.con.freq][1] : 'How many days?', '', o.days, 5) + live();
      case 'deliver':
        if (S.cat === 'content') {
          var k = S.con;
          return '<h2 class="eg3w-q">What videos do you need?</h2><p class="eg3w-sub">' + (k.type === 'retainer' ? 'Per ' + FREQ[k.freq][1] + '. ' : '') + '4 or more videos unlock a bulk discount.</p>' +
            '<div class="eg3w-f" style="gap:10px">' + counter('con.quick', 'Quick hits', 'Very short clips', k.quick, 12) + counter('con.short', 'Short form', 'Social videos, up to 1-2 minutes', k.short, 12) + counter('con.medium', 'Medium form', '3-5 minutes', k.medium, 8) +
            '<label class="eg3w-check"><input type="checkbox" data-bool="con.longOn"' + (k.longOn ? ' checked' : '') + '> I need long-form videos (5+ minutes)</label>' +
            (k.longOn ? counter('con.long5', 'Long form, 5+ min', '', k.long5, 6) + counter('con.long10', 'Long form, 10+ min', '', k.long10, 6) + counter('con.long15', 'Long form, 15+ min', '', k.long15, 6) : '') + '</div>' +
            (k.type === 'once' ? turnChips('con.turn', k.turn) : '') + live();
        }
        var c = S.com;
        return '<h2 class="eg3w-q">What do you need delivered?</h2><p class="eg3w-sub">Start with the main video, then add anything else.</p>' +
          '<div class="eg3w-f"><span class="eg3w-label">Main video</span><div class="eg3w-grid">' +
            card('com.main', 'basic', 'Short', 'Up to 2 minutes', '', c.main === 'basic') + card('com.main', 'standard', 'Standard', '2-5 minutes with titles and graphics', '', c.main === 'standard') + card('com.main', 'premium', 'Premium', '5+ minutes or a complex story', '', c.main === 'premium') + card('com.main', 'none', 'No main video', 'Just the pieces below', '', c.main === 'none') + '</div></div>' +
          '<div class="eg3w-f" style="gap:10px">' + counter('com.social', 'Social cutdowns', 'Short versions for social', c.social, 10) + counter('com.testimonial', 'Testimonial videos', 'Customer or team interviews', c.testimonial, 6) + counter('com.recap', 'Event recaps', '', c.recap, 4) + '</div>' +
          '<div class="eg3w-f"><span class="eg3w-label">Extras</span><label class="eg3w-check"><input type="checkbox" data-bool="com.drone"' + (c.drone ? ' checked' : '') + '> Drone footage</label><label class="eg3w-check"><input type="checkbox" data-bool="com.sound"' + (c.sound ? ' checked' : '') + '> Premium sound design</label></div>' +
          turnChips('com.turn', c.turn) + live();
      case 'coverage':
        var p = S.spo;
        return '<h2 class="eg3w-q">What kind of coverage?</h2>' +
          '<div class="eg3w-grid">' + card('spo.type', 'games', 'Game coverage', 'Each game includes a 60-90 second highlight', 'About ' + money(SPO.game) + ' a game', p.type === 'games') + card('spo.type', 'project', 'Single video', 'Hype video, senior night, recruiting reel', '', p.type === 'project') + '</div>' +
          (p.type === 'games' ? counter('spo.games', 'How many games?', '', p.games, 15) :
            '<div class="eg3w-chips">' + chip('spo.project', 'hype', 'Hype video', p.project === 'hype') + chip('spo.project', 'senior', 'Senior night', p.project === 'senior') + chip('spo.project', 'recruit', 'Recruiting reel', p.project === 'recruit') + chip('spo.project', 'recap', 'Season recap', p.project === 'recap') + '</div>') + live();
      case 'extras':
        return '<h2 class="eg3w-q">Anything extra?</h2>' +
          (S.spo.type === 'games' ? counter('spo.reels', 'Extra highlight reels', 'Beyond the one per game', S.spo.reels, 6) : '') +
          turnChips('spo.turn', S.spo.turn) + live();
      case 'contact':
        var w = S.who;
        return '<h2 class="eg3w-q">Where should we send it?</h2><p class="eg3w-sub">You\'ll see your range on the next screen, and we\'ll email you a copy.</p>' +
          '<div class="eg3w-two"><label class="eg3w-f"><span class="eg3w-label">Name *</span><input type="text" data-text="who.name" value="' + esc(w.name) + '" autocomplete="name"></label>' +
          '<label class="eg3w-f"><span class="eg3w-label">Email *</span><input type="email" data-text="who.email" value="' + esc(w.email) + '" autocomplete="email"></label></div>' +
          '<div class="eg3w-two"><label class="eg3w-f"><span class="eg3w-label">Business or organization</span><input type="text" data-text="who.org" value="' + esc(w.org) + '" autocomplete="organization"></label>' +
          '<label class="eg3w-f"><span class="eg3w-label">Phone</span><input type="tel" data-text="who.phone" value="' + esc(w.phone) + '" autocomplete="tel"></label></div>' +
          '<label class="eg3w-f"><span class="eg3w-label">When do you need it?</span><input type="text" data-text="who.when" value="' + esc(w.when) + '" placeholder="Shoot date or deadline, if you know it"></label>' +
          '<label class="eg3w-check"><input type="checkbox" data-bool="who.nonprofit"' + (w.nonprofit ? ' checked' : '') + '> We\'re a nonprofit</label>' +
          '<input type="text" class="eg3w-honey" tabindex="-1" autocomplete="off" aria-hidden="true" data-honey>' +
          '<div class="eg3w-status" data-status></div>';
      case 'result':
        var e = estimate();
        return '<div class="eg3w-result"><span class="eg3w-per">Your rough range' + (e.per ? ', per ' + e.per : '') + '</span>' +
          '<div class="eg3w-range">' + money(e.low) + ' - ' + money(e.high) + '</div>' +
          '<p class="eg3w-sub">Based on what you picked. Your final quote depends on the details, and Elijah will follow up within 1-2 business days to lock it in.' + (S.who.nonprofit ? ' Nonprofits get 15% off the final quote.' : '') + '</p>' +
          '<ul class="eg3w-list">' + e.items.map(function (i) { return '<li>' + esc(i) + '</li>'; }).join('') + '</ul>' +
          '<div class="eg3w-status ' + (sent === false ? 'err' : 'ok') + '">' + (sent === false ? 'We couldn\'t send the email copy. Reach us at ' + EMAIL + ' and we\'ll get you sorted.' : 'A copy is on its way to ' + esc(S.who.email) + '.') + '</div>' +
          '<div class="eg3w-nav"><button type="button" class="eg3w-back" data-restart>Start a new quote</button><a class="eg3w-btn" href="/portfolio#' + S.cat + '">See our ' + CATS[S.cat].toLowerCase() + ' work</a></div></div>';
    }
    return '';
  }

  function canNext(name) {
    if (name === 'type') return !!S.cat;
    if (name === 'contact') return S.who.name.trim().length > 1 && /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(S.who.email.trim());
    if (name === 'deliver' && S.cat === 'content') { var k = S.con; return (k.quick + k.short + k.medium + (k.longOn ? k.long5 + k.long10 + k.long15 : 0)) > 0 || k.days > 0; }
    return true;
  }

  function render(focus) {
    var list = steps(), name = list[step], total = list.length - 1;
    var html = '';
    if (name !== 'result') {
      html += '<div class="eg3w-top"><div class="eg3w-bar"><span style="width:' + Math.round(step / total * 100) + '%"></span></div><span class="eg3w-count">Step ' + (step + 1) + ' of ' + total + '</span></div>';
    }
    html += '<div class="eg3w-step">' + stepHTML(name);
    if (name !== 'result') {
      html += '<div class="eg3w-nav">' + (step ? '<button type="button" class="eg3w-back" data-back>Back</button>' : '<span></span>') +
        '<button type="button" class="eg3w-btn" data-next' + (canNext(name) ? '' : ' disabled') + '>' + (name === 'contact' ? 'See my range' : name === 'describe' && !S.desc.trim() ? 'Skip' : 'Next') + '</button></div>';
    }
    html += '</div>';
    mount.innerHTML = html;
    Array.prototype.forEach.call(mount.querySelectorAll('input[type=range]'), paintRange);
    if (focus !== false) {
      var f = mount.querySelector('textarea, input[type=text]:not([data-honey])');
      if (f && (name === 'describe' || name === 'contact')) setTimeout(function () { try { f.focus({ preventScroll: true }); } catch (e) {} }, 60);
    }
    if (opts.onStep) opts.onStep(name);
  }
  function paintRange(el) { el.style.setProperty('--fill', (el.value - el.min) / (el.max - el.min || 1) * 100 + '%'); }
  function setPath(path, v) { var ks = path.split('.'); var o = S; while (ks.length > 1) o = o[ks.shift()]; o[ks[0]] = v; }
  function getPath(path) { return path.split('.').reduce(function (o, k) { return o[k]; }, S); }
  function refreshNav() {
    var name = steps()[step], nb = mount.querySelector('[data-next]');
    if (nb) { nb.disabled = !canNext(name); if (name === 'describe') nb.textContent = S.desc.trim() ? 'Next' : 'Skip'; }
    var lv = mount.querySelector('[data-live]');
    if (lv) { var e = estimate(); lv.innerHTML = 'Running estimate: <b>' + money(e.low) + ' - ' + money(e.high) + '</b>' + (e.per ? ' per ' + e.per : ''); }
  }

  function sendEmail() {
    var e = estimate(), w = S.who;
    var nm = w.name.trim(), rangeTxt = money(e.low) + ' - ' + money(e.high) + (e.per ? ' per ' + e.per : '');
    var body = {
      _subject: 'Quote request: ' + CATS[S.cat] + ' from ' + nm + (w.org ? ' (' + w.org + ')' : ''),
      _template: 'table',
      _replyto: w.email.trim(),
      email: w.email.trim(),
      _autoresponse: 'Hi ' + nm.split(' ')[0] + ', thanks for reaching out to EG3 Media!\n\nBased on what you told us, your ' + CATS[S.cat].toLowerCase() + ' project will likely land between ' + rangeTxt + '.\n\nWhat you picked:\n- ' + e.items.join('\n- ') + '\n\nThis is a rough range. Elijah will follow up within 1-2 business days to talk through the details and send an exact quote.\n\nEG3 Media\nAbilene, Texas\neg3media.com',
      Name: nm,
      Organization: w.org || '-',
      Phone: w.phone || '-',
      Timeline: w.when || '-',
      Nonprofit: w.nonprofit ? 'Yes' : 'No',
      'Project type': CATS[S.cat] + (S.cat === 'content' ? (S.con.type === 'retainer' ? ', ongoing (' + FREQ[S.con.freq][0].toLowerCase() + ')' : ', one-time') : ''),
      Description: S.desc.trim() || '-',
      Selections: e.items.join(' | '),
      'Estimate (calculated)': money(e.total) + (e.per ? ' per ' + e.per : ''),
      'Range shown': rangeTxt
    };
    return fetch('https://formsubmit.co/ajax/' + EMAIL, { method: 'POST', headers: { 'Content-Type': 'application/json', 'Accept': 'application/json' }, body: JSON.stringify(body) })
      .then(function (r) { return r.json().then(function (d) { if (!r.ok || String(d.success) === 'false') throw 0; }); });
  }

  mount.classList.add('eg3w');
  mount.addEventListener('click', function (ev) {
    var b = ev.target.closest('button'); if (!b || !mount.contains(b)) return;
    if (b.dataset.pick) {
      var g = b.dataset.pick;
      if (g === 'cat') { if (S.cat !== b.dataset.v) { S.cat = b.dataset.v; } render(false); setTimeout(function () { step = 1; render(); scrollTop(); }, 180); return; }
      setPath(g, b.dataset.v); render(false); return;
    }
    if (b.hasAttribute('data-back')) { step = Math.max(0, step - 1); render(); scrollTop(); return; }
    if (b.hasAttribute('data-restart')) { step = 0; sent = null; render(); scrollTop(); return; }
    if (b.hasAttribute('data-next')) {
      var name = steps()[step]; if (!canNext(name)) return;
      if (name === 'contact') {
        if (mount.querySelector('[data-honey]').value) return;
        b.disabled = true; b.textContent = 'Working it out...';
        sendEmail().then(function () { sent = true; }, function () { sent = false; }).then(function () { step++; render(); scrollTop(); });
        return;
      }
      step++; render(); scrollTop();
    }
  });
  mount.addEventListener('input', function (ev) {
    var el = ev.target;
    if (el.dataset.num) {
      var v = parseInt(el.value, 10) || 0; setPath(el.dataset.num, v); paintRange(el);
      var row = el.closest('.eg3w-row'); row.querySelector('output').textContent = v; row.classList.toggle('off', !v);
    }
    if (el.dataset.text) setPath(el.dataset.text, el.value);
    refreshNav();
  });
  mount.addEventListener('change', function (ev) {
    var el = ev.target;
    if (el.dataset.bool) { setPath(el.dataset.bool, el.checked); if (el.dataset.bool === 'con.longOn') render(false); else refreshNav(); }
  });
  function scrollTop() {
    if (opts.scroller) { opts.scroller.scrollTop = 0; return; }
    var r = mount.getBoundingClientRect(); if (r.top < 0) window.scrollTo({ top: window.pageYOffset + r.top - 90, behavior: 'smooth' });
  }
  render(false);
  return { reset: function () { step = 0; sent = null; render(false); } };
};
</script>

  @media (max-width: 640px) { .eg3qb-panel { border-radius: 0; min-height: 100%; border: 0; } .eg3qb-btn { padding: 12px 16px; font-size: 16px; } }
  .eg3qb-x { position: absolute; top: 14px; right: 14px; width: 42px; height: 42px; border-radius: 50%; border: 1px solid #444; background: none; color: #fff; font-size: 22px; line-height: 1; cursor: pointer; }
  .eg3qb-x:hover { background: #fff; color: #000; }
  .eg3qb-tag { position: absolute; top: 24px; left: clamp(22px, 4vw, 44px); font-family: 'Anton', 'Impact', sans-serif; font-size: 16px; letter-spacing: .12em; text-transform: uppercase; color: #a3a3a0; }
  html.eg3qb-lock, html.eg3qb-lock body { overflow: hidden !important; }
</style>
<script>
(function () {
  if (window.__eg3qb) return; window.__eg3qb = 1;
  var path = location.pathname.replace(/\/+$/, '').toLowerCase();
  // no pop-up on the real estate page (it has its own calculator) or on the quote page itself
  var SKIP = ['/realestate', '/quote'];
  if (SKIP.indexOf(path) !== -1) return;

  function start() {
    var btn = document.createElement('button');
    btn.type = 'button'; btn.className = 'eg3qb-btn'; btn.innerHTML = '<span class="dot"></span>Get a quote';
    btn.setAttribute('aria-haspopup', 'dialog');
    var modal = document.createElement('div');
    modal.className = 'eg3qb-modal'; modal.hidden = true;
    modal.setAttribute('role', 'dialog'); modal.setAttribute('aria-modal', 'true'); modal.setAttribute('aria-label', 'Get a quote');
    modal.innerHTML = '<div class="eg3qb-panel"><span class="eg3qb-tag">EG3 Media · Quote</span><button type="button" class="eg3qb-x" aria-label="Close">&times;</button><div class="eg3qb-form"></div></div>';
    document.body.appendChild(btn); document.body.appendChild(modal);
    var form = null, lastFocus = null;

    function open() {
      lastFocus = document.activeElement;
      if (!form) form = window.EG3Quote(modal.querySelector('.eg3qb-form'), { scroller: modal });
      modal.hidden = false; document.documentElement.classList.add('eg3qb-lock');
      requestAnimationFrame(function () { modal.classList.add('open'); });
      btn.classList.add('is-hidden');
      setTimeout(function () { var f = modal.querySelector('.eg3w-card, .eg3qb-x'); if (f) f.focus(); }, 80);
    }
    function close() {
      modal.classList.remove('open'); document.documentElement.classList.remove('eg3qb-lock');
      setTimeout(function () { modal.hidden = true; }, 300);
      btn.classList.remove('is-hidden');
      if (lastFocus && lastFocus.focus) lastFocus.focus();
    }
    btn.addEventListener('click', open);
    modal.querySelector('.eg3qb-x').addEventListener('click', close);
    modal.addEventListener('click', function (e) { if (e.target === modal) close(); });
    document.addEventListener('keydown', function (e) { if (e.key === 'Escape' && !modal.hidden) close(); });
    // any "Get a quote" link to /quote opens the pop-up instead
    document.addEventListener('click', function (e) {
      var a = e.target.closest && e.target.closest('a[href]'); if (!a) return;
      var h = a.getAttribute('href') || '';
      if (/^(https?:\/\/(www\.)?eg3media\.com)?\/quote\/?(#.*)?$/i.test(h)) { e.preventDefault(); open(); }
    });
    // stay out of the way during page intros: show after a short delay
    btn.classList.add('is-hidden');
    setTimeout(function () { btn.classList.remove('is-hidden'); }, 2500);
  }
  function go() { if (window.EG3Quote && document.body) start(); else setTimeout(go, 50); }
  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', go); else go();
})();
</script>

<script src="/assets/site.js"></script>
